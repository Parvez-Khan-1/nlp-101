<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Scaled dot-product self-attention" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Scaled dot-product self-attention</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="340" fill="#fcfcfb"/>
<rect x="20" y="40" width="110" height="40" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="75.0" y="64.55" font-size="13" text-anchor="middle" fill="#1d1d1f">the</text>
<rect x="20" y="94" width="110" height="40" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="75.0" y="118.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">bank</text>
<rect x="20" y="148" width="110" height="40" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="75.0" y="172.55" font-size="13" text-anchor="middle" fill="#1d1d1f">approved</text>
<rect x="20" y="202" width="110" height="40" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="75.0" y="226.55" font-size="13" text-anchor="middle" fill="#1d1d1f">my</text>
<rect x="20" y="256" width="110" height="40" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="75.0" y="280.55" font-size="13" text-anchor="middle" fill="#1d1d1f">loan</text>
<rect x="190" y="60" width="120" height="70" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="250.0" y="99.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Q = X·W_Q</text>
<text x="250" y="152" font-size="11.5" text-anchor="middle" fill="#52514e">query: what am I</text>
<text x="250" y="168" font-size="11.5" text-anchor="middle" fill="#52514e">looking for?</text>
<rect x="340" y="60" width="120" height="70" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="400.0" y="99.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">K = X·W_K</text>
<text x="400" y="152" font-size="11.5" text-anchor="middle" fill="#52514e">key: what do I</text>
<text x="400" y="168" font-size="11.5" text-anchor="middle" fill="#52514e">contain?</text>
<rect x="490" y="60" width="120" height="70" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="550.0" y="99.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">V = X·W_V</text>
<text x="550" y="152" font-size="11.5" text-anchor="middle" fill="#52514e">value: what do I</text>
<text x="550" y="168" font-size="11.5" text-anchor="middle" fill="#52514e">pass on?</text>
<line x1="132" y1="150" x2="186" y2="100" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190" y="200" width="420" height="54" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="400.0" y="232.95" font-size="17" text-anchor="middle" fill="#1d1d1f" font-weight="700">softmax( Q·Kᵀ / √d ) · V</text>
<text x="400" y="280" font-size="12.5" text-anchor="middle" fill="#52514e">scores every pair of words, turns scores into weights,</text>
<text x="400" y="298" font-size="12.5" text-anchor="middle" fill="#52514e">and mixes the values: a new, context-aware vector per word</text>
<line x1="612" y1="227" x2="660" y2="227" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="820" y="60" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">"bank" attends to…</text>
<text x="730" y="98" font-size="13" text-anchor="end" fill="#1d1d1f">loan</text>
<rect x="740" y="84" width="220" height="20" rx="4" fill="#347ed8" stroke="none"/>
<text x="968" y="99" font-size="12" text-anchor="start" fill="#52514e">0.46</text>
<text x="730" y="132" font-size="13" text-anchor="end" fill="#1d1d1f">approved</text>
<rect x="740" y="118" width="148" height="20" rx="4" fill="#659de1" stroke="none"/>
<text x="896" y="133" font-size="12" text-anchor="start" fill="#52514e">0.31</text>
<text x="730" y="166" font-size="13" text-anchor="end" fill="#1d1d1f">bank</text>
<rect x="740" y="152" width="71" height="20" rx="4" fill="#99beeb" stroke="none"/>
<text x="819" y="167" font-size="12" text-anchor="start" fill="#52514e">0.15</text>
<text x="730" y="200" font-size="13" text-anchor="end" fill="#1d1d1f">the</text>
<rect x="740" y="186" width="23" height="20" rx="4" fill="#b9d2f1" stroke="none"/>
<text x="771" y="201" font-size="12" text-anchor="start" fill="#52514e">0.05</text>
<text x="730" y="234" font-size="13" text-anchor="end" fill="#1d1d1f">my</text>
<rect x="740" y="220" width="14" height="20" rx="4" fill="#c0d7f2" stroke="none"/>
<text x="762" y="235" font-size="12" text-anchor="start" fill="#52514e">0.03</text>
<text x="820" y="270" font-size="11.5" text-anchor="middle" fill="#52514e" font-style="italic">(illustrative weights for a trained model)</text>
<text x="820" y="292" font-size="12.5" text-anchor="middle" fill="#1d1d1f">→ "bank" now means the financial one</text>
</svg>
