<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Retrieval-augmented generation architecture for a support chatbot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Retrieval-augmented generation architecture for a support chatbot</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="400" fill="#fcfcfb"/>
<rect x="20" y="160" width="140" height="64" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="90.0" y="188.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Customer</text>
<text x="90.0" y="205.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">question</text>
<text x="90" y="250" font-size="11.5" text-anchor="middle" fill="#52514e" font-style="italic">"Can I cancel after</text>
<text x="90" y="266" font-size="11.5" text-anchor="middle" fill="#52514e" font-style="italic">the food is picked up?"</text>
<line x1="162" y1="192" x2="208" y2="192" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="210" y="160" width="150" height="64" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="285.0" y="188.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Embed query</text>
<text x="285.0" y="205.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">+ search</text>
<rect x="210" y="300" width="150" height="74" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="285.0" y="324.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Vector DB</text>
<text x="285.0" y="341.9" font-size="11" text-anchor="middle" fill="#52514e">policies · FAQs</text>
<text x="285.0" y="359.4" font-size="11" text-anchor="middle" fill="#52514e">order history</text>
<line x1="285" y1="298" x2="285" y2="228" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="300" y1="228" x2="300" y2="296" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="80" y="330" font-size="12" text-anchor="middle" fill="#52514e">offline: chunk + embed</text>
<text x="80" y="346" font-size="12" text-anchor="middle" fill="#52514e">all documents</text>
<line x1="150" y1="337" x2="206" y2="337" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<line x1="362" y1="192" x2="408" y2="192" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="410" y="150" width="170" height="84" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="495.0" y="170.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Prompt</text>
<text x="495.0" y="188.15" font-size="11" text-anchor="middle" fill="#52514e">question</text>
<text x="495.0" y="205.65" font-size="11" text-anchor="middle" fill="#52514e">+ top-5 chunks</text>
<text x="495.0" y="223.15" font-size="11" text-anchor="middle" fill="#52514e">+ instructions</text>
<line x1="582" y1="192" x2="628" y2="192" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="630" y="160" width="120" height="64" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="690.0" y="197.6" font-size="16" text-anchor="middle" fill="#1d1d1f" font-weight="700">LLM</text>
<line x1="752" y1="192" x2="788" y2="192" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="790" y="150" width="190" height="84" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="885.0" y="179.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Guardrails</text>
<text x="885.0" y="196.9" font-size="11" text-anchor="middle" fill="#52514e">PII · policy · tone</text>
<text x="885.0" y="214.4" font-size="11" text-anchor="middle" fill="#52514e">cite sources</text>
<line x1="885" y1="236" x2="885" y2="290" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="790" y="292" width="190" height="64" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="885.0" y="320.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Answer</text>
<text x="885.0" y="337.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">+ citations</text>
<rect x="430" y="300" width="300" height="56" rx="10" fill="#fcf3e0" stroke="#eda100" stroke-width="2" stroke-dasharray="6 4"/>
<text x="580.0" y="324.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Evaluation &amp; monitoring</text>
<text x="580.0" y="340.675" font-size="10" text-anchor="middle" fill="#52514e">faithfulness · latency · cost · CSAT</text>
<path d="M 788 324 L 734 324" fill="none" stroke="#eda100" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="500" y="50" font-size="13" text-anchor="middle" fill="#52514e">The LLM does not "know" your company. RAG hands it the right documents at question time,</text>
<text x="500" y="72" font-size="13" text-anchor="middle" fill="#52514e">so answers stay current and traceable, without retraining the model.</text>
</svg>
