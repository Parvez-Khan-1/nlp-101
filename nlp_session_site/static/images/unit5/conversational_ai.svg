<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Evolution of conversational AI architectures" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Evolution of conversational AI architectures</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="330" fill="#fcfcfb"/>
<text x="128.0" y="36" font-size="12.5" text-anchor="middle" fill="#4a3aa7" font-weight="700">1966 → 2010s</text>
<rect x="14" y="50" width="228" height="54" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="128.0" y="82.25" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">Rule-based bots</text>
<rect x="14" y="118" width="228" height="110" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="128.0" y="148" font-size="12.5" text-anchor="middle" fill="#1d1d1f">keyword + decision trees</text>
<text x="128.0" y="174" font-size="12.5" text-anchor="middle" fill="#52514e">"Press 1 for refunds"</text>
<text x="128.0" y="200" font-size="12.5" text-anchor="middle" fill="#52514e">breaks on any new phrasing</text>
<line x1="244" y1="77" x2="256" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="372.0" y="36" font-size="12.5" text-anchor="middle" fill="#eb6834" font-weight="700">2016 → 2022</text>
<rect x="258" y="50" width="228" height="54" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="372.0" y="82.25" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">Intent + slot bots</text>
<rect x="258" y="118" width="228" height="110" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="372.0" y="148" font-size="12.5" text-anchor="middle" fill="#1d1d1f">NLU classifies intent,</text>
<text x="372.0" y="174" font-size="12.5" text-anchor="middle" fill="#52514e">extracts slots (Unit 1)</text>
<text x="372.0" y="200" font-size="12.5" text-anchor="middle" fill="#52514e">dialog manager follows a flow</text>
<line x1="488" y1="77" x2="500" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="616.0" y="36" font-size="12.5" text-anchor="middle" fill="#2a78d6" font-weight="700">2022 →</text>
<rect x="502" y="50" width="228" height="54" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="616.0" y="82.25" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">LLM assistants</text>
<rect x="502" y="118" width="228" height="110" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="616.0" y="148" font-size="12.5" text-anchor="middle" fill="#1d1d1f">LLM understands + writes</text>
<text x="616.0" y="174" font-size="12.5" text-anchor="middle" fill="#52514e">RAG grounds it in your data</text>
<text x="616.0" y="200" font-size="12.5" text-anchor="middle" fill="#52514e">guardrails + evaluation</text>
<line x1="732" y1="77" x2="744" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="860.0" y="36" font-size="12.5" text-anchor="middle" fill="#008300" font-weight="700">2024 →</text>
<rect x="746" y="50" width="228" height="54" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="860.0" y="82.25" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">Agents</text>
<rect x="746" y="118" width="228" height="110" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="860.0" y="148" font-size="12.5" text-anchor="middle" fill="#1d1d1f">LLM plans multi-step tasks</text>
<text x="860.0" y="174" font-size="12.5" text-anchor="middle" fill="#52514e">calls tools and APIs</text>
<text x="860.0" y="200" font-size="12.5" text-anchor="middle" fill="#52514e">"cancel my order and refund"</text>
<text x="500" y="272" font-size="12.5" text-anchor="middle" fill="#52514e">Each step handles more of what customers actually say, and needs more engineering to keep it safe, accurate and affordable.</text>
<text x="500" y="296" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-style="italic">Most real support systems today are hybrids: flows for payments and refunds, LLMs for everything else.</text>
</svg>
