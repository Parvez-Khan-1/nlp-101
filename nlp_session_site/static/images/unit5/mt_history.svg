<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Five eras of machine translation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Five eras of machine translation</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="300" fill="#fcfcfb"/>
<text x="103.0" y="40" font-size="12.5" text-anchor="middle" fill="#4a3aa7" font-weight="700">1950s–1980s</text>
<rect x="14" y="54" width="178" height="110" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="103.0" y="95.95" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Rule-based</text>
<text x="103.0" y="114.075" font-size="11.5" text-anchor="middle" fill="#52514e">dictionaries +</text>
<text x="103.0" y="132.2" font-size="11.5" text-anchor="middle" fill="#52514e">hand-written grammar</text>
<line x1="194" y1="109" x2="206" y2="109" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="297.0" y="40" font-size="12.5" text-anchor="middle" fill="#eb6834" font-weight="700">1990s–2016</text>
<rect x="208" y="54" width="178" height="110" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="297.0" y="95.95" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Statistical</text>
<text x="297.0" y="114.075" font-size="11.5" text-anchor="middle" fill="#52514e">phrase tables learned</text>
<text x="297.0" y="132.2" font-size="11.5" text-anchor="middle" fill="#52514e">from parallel text</text>
<line x1="388" y1="109" x2="400" y2="109" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="491.0" y="40" font-size="12.5" text-anchor="middle" fill="#2a78d6" font-weight="700">2014–2017</text>
<rect x="402" y="54" width="178" height="110" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="491.0" y="95.95" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Neural seq2seq</text>
<text x="491.0" y="114.075" font-size="11.5" text-anchor="middle" fill="#52514e">LSTM encoder–decoder</text>
<text x="491.0" y="132.2" font-size="11.5" text-anchor="middle" fill="#52514e">+ attention (GNMT, 2016)</text>
<line x1="582" y1="109" x2="594" y2="109" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="685.0" y="40" font-size="12.5" text-anchor="middle" fill="#1baf7a" font-weight="700">2017 →</text>
<rect x="596" y="54" width="178" height="110" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="685.0" y="95.95" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Transformer</text>
<text x="685.0" y="114.075" font-size="11.5" text-anchor="middle" fill="#52514e">self-attention, parallel</text>
<text x="685.0" y="132.2" font-size="11.5" text-anchor="middle" fill="#52514e">training, much better</text>
<line x1="776" y1="109" x2="788" y2="109" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="879.0" y="40" font-size="12.5" text-anchor="middle" fill="#008300" font-weight="700">2020 →</text>
<rect x="790" y="54" width="178" height="110" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="879.0" y="95.95" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">LLMs</text>
<text x="879.0" y="114.075" font-size="11.5" text-anchor="middle" fill="#52514e">one model, many languages;</text>
<text x="879.0" y="132.2" font-size="11.5" text-anchor="middle" fill="#52514e">IndicTrans2, GPT, Gemini</text>
<rect x="14" y="178" width="178" height="74" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="103.0" y="200" font-size="11.5" text-anchor="middle" fill="#52514e">"I love biryani"</text>
<text x="103.0" y="220" font-size="11.5" text-anchor="middle" fill="#52514e">→ look up each word,</text>
<text x="103.0" y="240" font-size="11.5" text-anchor="middle" fill="#52514e">apply grammar rules</text>
<rect x="208" y="178" width="178" height="74" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="297.0" y="200" font-size="11.5" text-anchor="middle" fill="#52514e">learn: "love" → "पसंद"</text>
<text x="297.0" y="220" font-size="11.5" text-anchor="middle" fill="#52514e">with probability 0.6</text>
<text x="297.0" y="240" font-size="11.5" text-anchor="middle" fill="#52514e">from millions of pairs</text>
<rect x="402" y="178" width="178" height="74" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="491.0" y="200" font-size="11.5" text-anchor="middle" fill="#52514e">encode whole sentence,</text>
<text x="491.0" y="220" font-size="11.5" text-anchor="middle" fill="#52514e">decode word by word,</text>
<text x="491.0" y="240" font-size="11.5" text-anchor="middle" fill="#52514e">attend to the source</text>
<rect x="596" y="178" width="178" height="74" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="685.0" y="200" font-size="11.5" text-anchor="middle" fill="#52514e">every word attends to</text>
<text x="685.0" y="220" font-size="11.5" text-anchor="middle" fill="#52514e">every other word</text>
<text x="685.0" y="240" font-size="11.5" text-anchor="middle" fill="#52514e">in parallel</text>
<rect x="790" y="178" width="178" height="74" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="879.0" y="200" font-size="11.5" text-anchor="middle" fill="#52514e">translate, summarise,</text>
<text x="879.0" y="220" font-size="11.5" text-anchor="middle" fill="#52514e">chat: one model</text>
<text x="879.0" y="240" font-size="11.5" text-anchor="middle" fill="#52514e">for all of it</text>
<text x="500" y="285" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-style="italic">Google Translate launched in 2006 on statistical MT and switched to neural MT in 2016.</text>
</svg>
