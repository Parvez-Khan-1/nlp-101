<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="The paradigm shift from task-specific models to pre-trained foundation models" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The paradigm shift from task-specific models to pre-trained foundation models</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="352" fill="#fcfcfb"/>
<text x="250" y="32" font-size="16" text-anchor="middle" fill="#52514e" font-weight="700">Before (≈2012–2017)</text>
<text x="750" y="32" font-size="16" text-anchor="middle" fill="#2a78d6" font-weight="700">After (2018 →)</text>
<rect x="30" y="60" width="180" height="50" rx="10" fill="#f0f0f0" stroke="#8a8983" stroke-width="2"/>
<text x="120.0" y="89.55" font-size="13" text-anchor="middle" fill="#1d1d1f">sentiment data</text>
<line x1="212" y1="85" x2="268" y2="85" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="60" width="190" height="50" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="365.0" y="89.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">sentiment model</text>
<rect x="30" y="132" width="180" height="50" rx="10" fill="#f0f0f0" stroke="#8a8983" stroke-width="2"/>
<text x="120.0" y="161.55" font-size="13" text-anchor="middle" fill="#1d1d1f">NER data</text>
<line x1="212" y1="157" x2="268" y2="157" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="132" width="190" height="50" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="365.0" y="161.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">NER model</text>
<rect x="30" y="204" width="180" height="50" rx="10" fill="#f0f0f0" stroke="#8a8983" stroke-width="2"/>
<text x="120.0" y="233.55" font-size="13" text-anchor="middle" fill="#1d1d1f">translation data</text>
<line x1="212" y1="229" x2="268" y2="229" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="204" width="190" height="50" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="365.0" y="233.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">translation model</text>
<text x="250" y="300" font-size="12.5" text-anchor="middle" fill="#52514e">every task starts from zero,</text>
<text x="250" y="318" font-size="12.5" text-anchor="middle" fill="#52514e">needs lots of labelled data</text>
<line x1="500" y1="20" x2="500" y2="330" stroke="#dddbd4" stroke-width="1.5"/>
<rect x="540" y="60" width="190" height="70" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="635.0" y="81.5" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">Pre-train</text>
<text x="635.0" y="100.25" font-size="12" text-anchor="middle" fill="#52514e">internet-scale text,</text>
<text x="635.0" y="119.0" font-size="12" text-anchor="middle" fill="#52514e">no labels needed</text>
<line x1="732" y1="95" x2="776" y2="95" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="778" y="50" width="200" height="90" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="878.0" y="81.5" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">Foundation model</text>
<text x="878.0" y="100.25" font-size="12" text-anchor="middle" fill="#52514e">BERT, GPT, LaMDA,</text>
<text x="878.0" y="119.0" font-size="12" text-anchor="middle" fill="#52514e">Claude, Gemini, Llama</text>
<rect x="700" y="170" width="278" height="38" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="839.0" y="193.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">fine-tune (small labelled set)</text>
<path d="M 878 142 L 878 150 L 690 150 L 690 189 L 698 189" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="700" y="218" width="278" height="38" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="839.0" y="241.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">prompt (zero / few examples)</text>
<path d="M 878 142 L 878 150 L 690 150 L 690 237 L 698 237" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="700" y="266" width="278" height="38" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="839.0" y="289.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">RAG + tools (your data)</text>
<path d="M 878 142 L 878 150 L 690 150 L 690 285 L 698 285" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="840" y="338" font-size="12.5" text-anchor="middle" fill="#52514e">one model, adapted to many tasks</text>
</svg>
