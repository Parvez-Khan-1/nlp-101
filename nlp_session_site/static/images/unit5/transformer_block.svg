<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="The Transformer block" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The Transformer block</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="420" fill="#fcfcfb"/>
<rect x="40" y="350" width="340" height="46" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="210.0" y="377.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">token embeddings + positional encoding</text>
<line x1="210" y1="348" x2="210" y2="316" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="40" width="340" height="272" rx="16" fill="#f4f8fc" stroke="#2a78d6" stroke-width="2" stroke-dasharray="7 5"/>
<text x="390" y="176" font-size="14" text-anchor="start" fill="#2a78d6" font-weight="700">× N layers</text>
<text x="390" y="196" font-size="12" text-anchor="start" fill="#52514e">(12 in BERT-base,</text>
<text x="390" y="212" font-size="12" text-anchor="start" fill="#52514e">96 in GPT-3)</text>
<rect x="80" y="238" width="260" height="50" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="210.0" y="267.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Multi-head self-attention</text>
<rect x="80" y="184" width="260" height="32" rx="10" fill="#f0f0f0" stroke="#8a8983" stroke-width="2"/>
<text x="210.0" y="204.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">Add &amp; LayerNorm</text>
<rect x="80" y="110" width="260" height="50" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="210.0" y="139.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Feed-forward network</text>
<rect x="80" y="60" width="260" height="32" rx="10" fill="#f0f0f0" stroke="#8a8983" stroke-width="2"/>
<text x="210.0" y="80.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">Add &amp; LayerNorm</text>
<line x1="210" y1="236" x2="210" y2="218" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="210" y1="182" x2="210" y2="162" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="210" y1="108" x2="210" y2="94" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 60 300 L 50 300 L 50 200 L 78 200" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 60 172 L 50 172 L 50 76 L 78 76" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="46" y="250" font-size="10.5" text-anchor="end" fill="#52514e">residual</text>
<line x1="210" y1="58" x2="210" y2="20" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="222" y="30" font-size="12.5" text-anchor="start" fill="#1d1d1f">contextual vectors → task head</text>
<text x="560" y="60" font-size="16" text-anchor="start" fill="#1d1d1f" font-weight="700">Why it won</text>
<text x="560" y="96" font-size="13.5" text-anchor="start" fill="#2a78d6" font-weight="700">Parallel</text>
<text x="560" y="116" font-size="12.5" text-anchor="start" fill="#52514e">every position computed at once on GPUs</text>
<text x="560" y="148" font-size="13.5" text-anchor="start" fill="#2a78d6" font-weight="700">Direct</text>
<text x="560" y="168" font-size="12.5" text-anchor="start" fill="#52514e">any word reaches any other in one step</text>
<text x="560" y="200" font-size="13.5" text-anchor="start" fill="#2a78d6" font-weight="700">Multi-head</text>
<text x="560" y="220" font-size="12.5" text-anchor="start" fill="#52514e">several attention patterns at once (syntax, coreference…)</text>
<text x="560" y="252" font-size="13.5" text-anchor="start" fill="#2a78d6" font-weight="700">Positional encoding</text>
<text x="560" y="272" font-size="12.5" text-anchor="start" fill="#52514e">order is added as a signal, not by recurrence</text>
<text x="560" y="304" font-size="13.5" text-anchor="start" fill="#2a78d6" font-weight="700">Scales</text>
<text x="560" y="324" font-size="12.5" text-anchor="start" fill="#52514e">more data + parameters kept improving results</text>
</svg>
