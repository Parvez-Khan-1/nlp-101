<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="BERT encoder versus GPT decoder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>BERT encoder versus GPT decoder</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="360" fill="#fcfcfb"/>
<text x="250" y="32" font-size="16" text-anchor="middle" fill="#2a78d6" font-weight="700">BERT: encoder, reads both directions</text>
<text x="750" y="32" font-size="16" text-anchor="middle" fill="#1baf7a" font-weight="700">GPT: decoder, reads left → right</text>
<rect x="20" y="140" width="86" height="42" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="63.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f">The</text>
<rect x="114" y="140" width="86" height="42" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="157.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f">food</text>
<rect x="208" y="140" width="86" height="42" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="251.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f">was</text>
<rect x="302" y="140" width="86" height="42" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="345.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">[MASK]</text>
<rect x="396" y="140" width="86" height="42" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="439.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f">good</text>
<path d="M 63 138 Q 204.0 70 345 138" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah)" opacity="0.8"/>
<path d="M 157 138 Q 251.0 70 345 138" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah)" opacity="0.8"/>
<path d="M 251 138 Q 298.0 95 345 138" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah)" opacity="0.8"/>
<path d="M 439 138 Q 392.0 95 345 138" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ah)" opacity="0.8"/>
<text x="345" y="208" font-size="14" text-anchor="middle" fill="#eb6834" font-weight="700">→ "really"</text>
<text x="250" y="246" font-size="12.5" text-anchor="middle" fill="#52514e">Pre-training: fill in masked words using context on both sides</text>
<text x="250" y="276" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Best for UNDERSTANDING</text>
<text x="250" y="298" font-size="12.5" text-anchor="middle" fill="#52514e">classification · NER · semantic search · reranking</text>
<line x1="500" y1="50" x2="500" y2="320" stroke="#dddbd4" stroke-width="1.5"/>
<rect x="530" y="140" width="84" height="42" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="572.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">The</text>
<line x1="616" y1="161" x2="620" y2="161" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="622" y="140" width="84" height="42" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="664.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">food</text>
<line x1="708" y1="161" x2="712" y2="161" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="714" y="140" width="84" height="42" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="756.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">was</text>
<line x1="800" y1="161" x2="804" y2="161" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="806" y="140" width="84" height="42" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="848.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">really</text>
<line x1="898" y1="161" x2="912" y2="161" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="914" y="140" width="74" height="42" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2" stroke-dasharray="6 4"/>
<text x="951.0" y="165.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">good</text>
<text x="750" y="246" font-size="12.5" text-anchor="middle" fill="#52514e">Pre-training: predict the next token, over and over</text>
<text x="750" y="276" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Best for GENERATION</text>
<text x="750" y="298" font-size="12.5" text-anchor="middle" fill="#52514e">chatbots · summaries · code · agents (and LaMDA, Gemini, Claude…)</text>
<text x="500" y="344" font-size="13" text-anchor="middle" fill="#1d1d1f" font-style="italic">Both are Transformers. The difference is which words each position is allowed to see.</text>
</svg>
