<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Sequence-to-sequence translation, with and without attention" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sequence-to-sequence translation, with and without attention</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="460" fill="#fcfcfb"/>
<text x="20" y="32" font-size="15" text-anchor="start" fill="#1d1d1f" font-weight="700">A. Plain Seq2Seq (2014): the bottleneck</text>
<rect x="40" y="60" width="90" height="48" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="85.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">enc</text>
<text x="85" y="132" font-size="14" text-anchor="middle" fill="#1d1d1f">I</text>
<line x1="132" y1="84" x2="148" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150" y="60" width="90" height="48" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="195.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">enc</text>
<text x="195" y="132" font-size="14" text-anchor="middle" fill="#1d1d1f">love</text>
<line x1="242" y1="84" x2="258" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="60" width="90" height="48" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="305.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">enc</text>
<text x="305" y="132" font-size="14" text-anchor="middle" fill="#1d1d1f">biryani</text>
<line x1="352" y1="84" x2="398" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400" y="52" width="120" height="64" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="460.0" y="80.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">context</text>
<text x="460.0" y="96.675" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">vector</text>
<text x="460" y="136" font-size="12" text-anchor="middle" fill="#e34948">whole sentence in one vector</text>
<line x1="522" y1="84" x2="568" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="570" y="60" width="88" height="48" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="614.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">dec</text>
<text x="614" y="132" font-size="15" text-anchor="middle" fill="#1d1d1f">मुझे</text>
<line x1="660" y1="84" x2="673" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="675" y="60" width="88" height="48" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="719.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">dec</text>
<text x="719" y="132" font-size="15" text-anchor="middle" fill="#1d1d1f">बिरयानी</text>
<line x1="765" y1="84" x2="778" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="780" y="60" width="88" height="48" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="824.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">dec</text>
<text x="824" y="132" font-size="15" text-anchor="middle" fill="#1d1d1f">पसंद</text>
<line x1="870" y1="84" x2="883" y2="84" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="885" y="60" width="88" height="48" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="929.0" y="88.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">dec</text>
<text x="929" y="132" font-size="15" text-anchor="middle" fill="#1d1d1f">है</text>
<line x1="20" y1="170" x2="980" y2="170" stroke="#dddbd4" stroke-width="1.5"/>
<text x="20" y="204" font-size="15" text-anchor="start" fill="#1d1d1f" font-weight="700">B. With attention (2015): look back at every input word</text>
<rect x="120" y="300" width="100" height="48" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="170.0" y="328.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">enc: I</text>
<line x1="222" y1="324" x2="258" y2="324" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="300" width="100" height="48" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="310.0" y="328.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">enc: love</text>
<line x1="362" y1="324" x2="398" y2="324" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400" y="300" width="100" height="48" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="450.0" y="328.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">enc: biryani</text>
<rect x="650" y="230" width="130" height="52" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="715.0" y="260.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">dec → "बिरयानी"</text>
<path d="M 170 298 Q 290 250 646 258" fill="none" stroke="#eb6834" stroke-width="1.5" opacity="0.35"/>
<path d="M 310 298 Q 430 250 646 258" fill="none" stroke="#eb6834" stroke-width="2" opacity="0.45"/>
<path d="M 450 298 Q 570 250 646 258" fill="none" stroke="#eb6834" stroke-width="6" opacity="1"/>
<text x="430" y="236" font-size="12.5" text-anchor="middle" fill="#eb6834" font-family="Consolas, Menlo, monospace">weights: 0.05  0.10  0.85</text>
<text x="500" y="390" font-size="13" text-anchor="middle" fill="#52514e">While writing "बिरयानी", the decoder puts 85% of its attention on "biryani".</text>
<text x="500" y="412" font-size="13" text-anchor="middle" fill="#52514e">No single-vector bottleneck, and alignments become interpretable.</text>
<text x="500" y="440" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Transformers (2017) keep the attention and drop the recurrence entirely.</text>
</svg>
