<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Simplified GRU cell with update and reset gates" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Simplified GRU cell with update and reset gates</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="300" fill="#fcfcfb"/>
<rect x="150" y="30" width="520" height="220" rx="16" fill="#fdf5f8" stroke="#e87ba4" stroke-width="2"/>
<text x="170" y="56" font-size="14" text-anchor="start" fill="#e87ba4" font-weight="700">GRU cell</text>
<line x1="40" y1="110" x2="780" y2="110" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah)"/>
<text x="50" y="98" font-size="15" text-anchor="start" fill="#2a78d6" font-weight="700">hₜ₋₁</text>
<text x="790" y="115" font-size="16" text-anchor="start" fill="#2a78d6" font-weight="700">hₜ</text>
<rect x="210" y="150" width="190" height="70" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="305.0" y="172.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Reset gate r</text>
<text x="305.0" y="189.9" font-size="11" text-anchor="middle" fill="#52514e">how much of the past to use</text>
<text x="305.0" y="207.4" font-size="11" text-anchor="middle" fill="#52514e">when proposing new content</text>
<rect x="430" y="150" width="210" height="70" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="535.0" y="172.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Update gate z</text>
<text x="535.0" y="189.9" font-size="11" text-anchor="middle" fill="#52514e">blend: keep old h (z) or take</text>
<text x="535.0" y="207.4" font-size="11" text-anchor="middle" fill="#52514e">the new candidate (1 − z)</text>
<circle cx="535" cy="110" r="17" fill="#d1e8d1" stroke="#008300" stroke-width="2"/>
<text x="535" y="113.85" font-size="11" text-anchor="middle" fill="#1d1d1f" font-weight="700">mix</text>
<line x1="535" y1="148" x2="535" y2="130" stroke="#008300" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 40 275 L 305 275 L 305 222" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 305 275 L 535 275 L 535 222" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="40" y="294" font-size="13" text-anchor="start" fill="#1d1d1f" font-weight="700">hₜ₋₁ , xₜ</text>
<rect x="700" y="150" width="280" height="110" rx="10" fill="#f0f0f0" stroke="#8a8983" stroke-width="2"/>
<text x="840.0" y="174.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">vs LSTM</text>
<text x="840.0" y="192.4" font-size="11" text-anchor="middle" fill="#52514e">2 gates instead of 3</text>
<text x="840.0" y="209.9" font-size="11" text-anchor="middle" fill="#52514e">no separate cell state</text>
<text x="840.0" y="227.4" font-size="11" text-anchor="middle" fill="#52514e">25% fewer parameters</text>
<text x="840.0" y="244.9" font-size="11" text-anchor="middle" fill="#52514e">similar accuracy on most tasks</text>
</svg>
