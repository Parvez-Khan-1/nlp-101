<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Simplified LSTM cell with forget, input and output gates" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Simplified LSTM cell with forget, input and output gates</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="420" fill="#fcfcfb"/>
<rect x="120" y="40" width="560" height="310" rx="16" fill="#f2f6fc" stroke="#2a78d6" stroke-width="2"/>
<text x="140" y="66" font-size="14" text-anchor="start" fill="#2a78d6" font-weight="700">LSTM cell</text>
<line x1="30" y1="100" x2="760" y2="100" stroke="#1baf7a" stroke-width="4"/><path d="M 760 92 L 776 100 L 760 108 z" fill="#1baf7a"/>
<text x="40" y="88" font-size="15" text-anchor="start" fill="#1baf7a" font-weight="700">cₜ₋₁</text>
<text x="786" y="106" font-size="15" text-anchor="start" fill="#1baf7a" font-weight="700">cₜ</text>
<text x="400" y="80" font-size="12.5" text-anchor="middle" fill="#1baf7a">cell state: the long-term memory "highway"</text>
<circle cx="260" cy="100" r="17" fill="#fbe3da" stroke="#eb6834" stroke-width="2"/>
<text x="260" y="106.3" font-size="18" text-anchor="middle" fill="#1d1d1f" font-weight="700">×</text>
<circle cx="450" cy="100" r="17" fill="#d1e8d1" stroke="#008300" stroke-width="2"/>
<text x="450" y="106.3" font-size="18" text-anchor="middle" fill="#1d1d1f" font-weight="700">+</text>
<rect x="120" y="200" width="160" height="62" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="200.0" y="227.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Forget gate</text>
<text x="200.0" y="244.65" font-size="11" text-anchor="middle" fill="#52514e">σ: what to erase</text>
<rect x="310" y="200" width="160" height="62" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="390.0" y="227.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Input gate</text>
<text x="390.0" y="244.65" font-size="11" text-anchor="middle" fill="#52514e">σ·tanh: what to write</text>
<rect x="500" y="200" width="160" height="62" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="580.0" y="227.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Output gate</text>
<text x="580.0" y="244.65" font-size="11" text-anchor="middle" fill="#52514e">σ: what to reveal</text>
<line x1="240" y1="198" x2="256" y2="120" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)"/>
<line x1="420" y1="198" x2="446" y2="120" stroke="#008300" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 620 100 L 620 150 L 620 196" fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="620" cy="300" r="17" fill="#dedbef" stroke="#4a3aa7" stroke-width="2"/>
<text x="620" y="306.3" font-size="18" text-anchor="middle" fill="#1d1d1f" font-weight="700">×</text>
<line x1="620" y1="264" x2="620" y2="280" stroke="#4a3aa7" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 637 300 L 742 300" fill="none" stroke="#4a3aa7" stroke-width="2" marker-end="url(#ah)"/>
<text x="752" y="305" font-size="16" text-anchor="start" fill="#4a3aa7" font-weight="700">hₜ</text>
<path d="M 30 330 L 480 330 L 480 266" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 290 330 L 290 266" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 480 330 L 580 330 L 580 266" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="30" y="360" font-size="13" text-anchor="start" fill="#1d1d1f" font-weight="700">hₜ₋₁ , xₜ  (previous output + current word)</text>
<rect x="792" y="140" width="202" height="170" rx="10" fill="#ffffff" stroke="#8a8983" stroke-width="2"/>
<text x="893" y="164" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">The equations</text>
<text x="893" y="190" font-size="10.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">f = σ(W_f·[h,x] + b_f)</text>
<text x="893" y="209" font-size="10.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">i = σ(W_i·[h,x] + b_i)</text>
<text x="893" y="228" font-size="10.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">g = tanh(W_g·[h,x] + b_g)</text>
<text x="893" y="247" font-size="10.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">c = f*c + i*g</text>
<text x="893" y="266" font-size="10.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">o = σ(W_o·[h,x] + b_o)</text>
<text x="893" y="285" font-size="10.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">h = o * tanh(c)</text>
<text x="400" y="400" font-size="12.5" text-anchor="middle" fill="#52514e">Gates are small learned valves (0 = block, 1 = pass). Additive updates let gradients flow across long spans.</text>
</svg>
