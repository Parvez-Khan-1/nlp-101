<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="A recurrent neural network unrolled over time" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A recurrent neural network unrolled over time</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="340" fill="#fcfcfb"/>
<rect x="40" y="130" width="90" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="85.0" y="165.6" font-size="16" text-anchor="middle" fill="#1d1d1f" font-weight="700">RNN</text>
<path d="M 110 130 C 130 80, 40 80, 60 128" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<text x="85" y="78" font-size="12" text-anchor="middle" fill="#52514e">hₜ loops back</text>
<line x1="85" y1="250" x2="85" y2="194" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="85" y="272" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">xₜ</text>
<text x="175" y="166" font-size="30" text-anchor="middle" fill="#52514e" font-weight="700">=</text>
<rect x="230" y="130" width="110" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="285.0" y="165.6" font-size="16" text-anchor="middle" fill="#1d1d1f" font-weight="700">h1</text>
<line x1="285" y1="250" x2="285" y2="194" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="240" y="252" width="90" height="38" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="285.0" y="275.9" font-size="14" text-anchor="middle" fill="#1d1d1f">"food"</text>
<line x1="342" y1="160" x2="403" y2="160" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="372" y="150" font-size="12" text-anchor="middle" fill="#52514e" font-style="italic">h</text>
<rect x="405" y="130" width="110" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="460.0" y="165.6" font-size="16" text-anchor="middle" fill="#1d1d1f" font-weight="700">h2</text>
<line x1="460" y1="250" x2="460" y2="194" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="415" y="252" width="90" height="38" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="460.0" y="275.9" font-size="14" text-anchor="middle" fill="#1d1d1f">"was"</text>
<line x1="517" y1="160" x2="578" y2="160" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="547" y="150" font-size="12" text-anchor="middle" fill="#52514e" font-style="italic">h</text>
<rect x="580" y="130" width="110" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="635.0" y="165.6" font-size="16" text-anchor="middle" fill="#1d1d1f" font-weight="700">h3</text>
<line x1="635" y1="250" x2="635" y2="194" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="590" y="252" width="90" height="38" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="635.0" y="275.9" font-size="14" text-anchor="middle" fill="#1d1d1f">"not"</text>
<line x1="692" y1="160" x2="753" y2="160" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="722" y="150" font-size="12" text-anchor="middle" fill="#52514e" font-style="italic">h</text>
<rect x="755" y="130" width="110" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="810.0" y="165.6" font-size="16" text-anchor="middle" fill="#1d1d1f" font-weight="700">h4</text>
<line x1="810" y1="250" x2="810" y2="194" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="765" y="252" width="90" height="38" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="810.0" y="275.9" font-size="14" text-anchor="middle" fill="#1d1d1f">"good"</text>
<line x1="867" y1="160" x2="900" y2="160" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="902" y="130" width="90" height="60" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="947.0" y="164.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Negative</text>
<text x="630" y="60" font-size="13" text-anchor="middle" fill="#52514e">Same weights reused at every step. The hidden state is a running summary of everything read so far.</text>
<text x="630" y="82" font-size="13" text-anchor="middle" fill="#52514e">Problem: by step 50, what happened at step 1 has mostly faded (vanishing gradient).</text>
<text x="595" y="318" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">Reads one word at a time → cannot be parallelised across the sentence.</text>
</svg>
