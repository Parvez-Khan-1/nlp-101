<text x="640" y="330" font-size="12.5" text-anchor="middle" fill="#52514e">Filters act as learned n-gram detectors. Max-pooling keeps the strongest signal wherever</text>
<text x="640" y="350" font-size="12.5" text-anchor="middle" fill="#52514e">it appears, so "not good" is caught at any position. Fast, parallel, great for short text.</text>
