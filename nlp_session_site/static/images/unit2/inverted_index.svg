<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="How an inverted index is built and queried">
<title>How an inverted index is built and queried</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="470" fill="#fcfcfb"/>
<text x="20" y="30" font-size="14" text-anchor="start" fill="#1d1d1f" font-weight="700">1. Index time (offline, once per document)</text>
<rect x="20" y="50" width="230" height="44" rx="8" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="135.0" y="76.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">D1  "Refund not received"</text>
<rect x="20" y="110" width="230" height="44" rx="8" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="135.0" y="136.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">D2  "Order late, refund please"</text>
<rect x="20" y="170" width="230" height="44" rx="8" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="135.0" y="196.375" font-size="12.5" text-anchor="middle" fill="#1d1d1f">D3  "Found hair in my food"</text>
<line x1="254" y1="132" x2="300" y2="132" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="302" y="62" width="210" height="140" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="407" y="86" font-size="15" text-anchor="middle" fill="#eb6834" font-weight="700">Analyzer</text>
<text x="407" y="112" font-size="12.5" text-anchor="middle" fill="#1d1d1f">tokenize</text>
<text x="407" y="134" font-size="12.5" text-anchor="middle" fill="#1d1d1f">lowercase</text>
<text x="407" y="156" font-size="12.5" text-anchor="middle" fill="#1d1d1f">drop stop words</text>
<text x="407" y="178" font-size="12.5" text-anchor="middle" fill="#1d1d1f">stem: received → receiv</text>
<text x="407" y="222" font-size="12" text-anchor="middle" fill="#eb6834" font-style="italic">same steps as Unit 1!</text>
<line x1="514" y1="132" x2="560" y2="132" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="780" y="30" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Inverted index: term → documents (postings)</text>
<rect x="565" y="46" width="130" height="26" rx="5" fill="#d4e4f6" stroke="none"/>
<text x="630" y="64" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">refund</text>
<rect x="700" y="46" width="270" height="26" rx="5" fill="#f1f0ec" stroke="none"/>
<text x="712" y="64" font-size="13" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">D1, D2</text>
<rect x="565" y="76" width="130" height="26" rx="5" fill="#d4e4f6" stroke="none"/>
<text x="630" y="94" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">receiv</text>
<rect x="700" y="76" width="270" height="26" rx="5" fill="#f1f0ec" stroke="none"/>
<text x="712" y="94" font-size="13" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">D1</text>
<rect x="565" y="106" width="130" height="26" rx="5" fill="#d4e4f6" stroke="none"/>
<text x="630" y="124" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">order</text>
<rect x="700" y="106" width="270" height="26" rx="5" fill="#f1f0ec" stroke="none"/>
<text x="712" y="124" font-size="13" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">D2</text>
<rect x="565" y="136" width="130" height="26" rx="5" fill="#d4e4f6" stroke="none"/>
<text x="630" y="154" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">late</text>
<rect x="700" y="136" width="270" height="26" rx="5" fill="#f1f0ec" stroke="none"/>
<text x="712" y="154" font-size="13" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">D2</text>
<rect x="565" y="166" width="130" height="26" rx="5" fill="#d4e4f6" stroke="none"/>
<text x="630" y="184" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">hair</text>
<rect x="700" y="166" width="270" height="26" rx="5" fill="#f1f0ec" stroke="none"/>
<text x="712" y="184" font-size="13" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">D3</text>
<rect x="565" y="196" width="130" height="26" rx="5" fill="#d4e4f6" stroke="none"/>
<text x="630" y="214" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">food</text>
<rect x="700" y="196" width="270" height="26" rx="5" fill="#f1f0ec" stroke="none"/>
<text x="712" y="214" font-size="13" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">D3</text>
<line x1="20" y1="262" x2="980" y2="262" stroke="#dddbd4" stroke-width="1.5"/>
<text x="20" y="290" font-size="14" text-anchor="start" fill="#1d1d1f" font-weight="700">2. Query time (every search, milliseconds)</text>
<rect x="20" y="310" width="190" height="50" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="115.0" y="339.9" font-size="14" text-anchor="middle" fill="#1d1d1f">query: "refund"</text>
<line x1="212" y1="335" x2="258" y2="335" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="310" width="200" height="50" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="360.0" y="331.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">look up "refund"</text>
<text x="360.0" y="348.65" font-size="11" text-anchor="middle" fill="#52514e">no scanning of documents</text>
<line x1="462" y1="335" x2="508" y2="335" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="510" y="310" width="190" height="50" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="605.0" y="339.9" font-size="14" text-anchor="middle" fill="#1d1d1f">candidates: D1, D2</text>
<line x1="702" y1="335" x2="748" y2="335" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="750" y="302" width="230" height="66" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="865.0" y="322.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">rank with BM25</text>
<text x="865.0" y="339.9" font-size="11" text-anchor="middle" fill="#52514e">TF-IDF + length normalisation</text>
<text x="865.0" y="357.4" font-size="11" text-anchor="middle" fill="#52514e">→ D1 first (shorter, exact)</text>
<text x="500" y="412" font-size="13" text-anchor="middle" fill="#1d1d1f">Measured on 1 million tickets in Python: a full scan for "hair" took 234 ms; the index lookup took 0.002 ms.</text>
<text x="500" y="436" font-size="13" text-anchor="middle" fill="#52514e">Lucene, the engine inside Apache Solr, Elasticsearch and OpenSearch, is built around this structure.</text>
</svg>
