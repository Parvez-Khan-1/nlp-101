<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Naive Bayes spam classification, worked example">
<title>Naive Bayes spam classification, worked example</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="380" fill="#fcfcfb"/>
<rect x="20" y="150" width="180" height="70" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="110.0" y="189.9" font-size="14" text-anchor="middle" fill="#1d1d1f">"win free order"</text>
<line x1="202" y1="170" x2="300" y2="95" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="202" y1="200" x2="300" y2="285" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="302" y="50" width="430" height="96" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="517" y="78" font-size="15" text-anchor="middle" fill="#e34948" font-weight="700">Spam score</text>
<text x="517" y="104" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">P(spam) × P(win|spam) × P(free|spam) × P(order|spam)</text>
<text x="517" y="128" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">0.30 × 0.15 × 0.20 × 0.05 = 0.000450</text>
<rect x="302" y="240" width="430" height="96" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="517" y="268" font-size="15" text-anchor="middle" fill="#008300" font-weight="700">Not-spam (ham) score</text>
<text x="517" y="294" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">P(ham) × P(win|ham) × P(free|ham) × P(order|ham)</text>
<text x="517" y="318" font-size="13" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">0.70 × 0.005 × 0.01 × 0.10 = 0.0000035</text>
<line x1="734" y1="98" x2="800" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="734" y1="288" x2="800" y2="210" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="802" y="140" width="180" height="100" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="892.0" y="174.7" font-size="17" text-anchor="middle" fill="#1d1d1f" font-weight="700">99.2% spam</text>
<text x="892.0" y="195.95" font-size="14" text-anchor="middle" fill="#52514e">0.000450 ÷ (0.000450</text>
<text x="892.0" y="217.2" font-size="14" text-anchor="middle" fill="#52514e">+ 0.0000035)</text>
<text x="517" y="24" font-size="13" text-anchor="middle" fill="#52514e">"Naive" assumption: each word is independent given the class, so we just multiply.</text>
<text x="517" y="366" font-size="12.5" text-anchor="middle" fill="#52514e">Word probabilities are learned by counting words in labelled spam and ham messages (numbers here are illustrative).</text>
</svg>
