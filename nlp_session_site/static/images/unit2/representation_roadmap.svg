<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="How text representations evolved, and where this unit fits">
<title>How text representations evolved, and where this unit fits</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="250" fill="#fcfcfb"/>
<rect x="14" y="70" width="146" height="76" rx="10" fill="#d7d3eb" stroke="#4a3aa7" stroke-width="2"/>
<text x="87.0" y="104.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">One-hot</text>
<text x="87.0" y="121.65" font-size="11" text-anchor="middle" fill="#52514e">1 word = 1 column</text>
<text x="87.0" y="58" font-size="12" text-anchor="middle" fill="#4a3aa7" font-weight="700">Unit 2</text>
<line x1="162" y1="108" x2="174" y2="108" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="176" y="70" width="146" height="76" rx="10" fill="#d7d3eb" stroke="#4a3aa7" stroke-width="2"/>
<text x="249.0" y="104.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Bag of words</text>
<text x="249.0" y="121.65" font-size="11" text-anchor="middle" fill="#52514e">count words per doc</text>
<text x="249.0" y="58" font-size="12" text-anchor="middle" fill="#4a3aa7" font-weight="700">Unit 2</text>
<line x1="324" y1="108" x2="336" y2="108" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="338" y="70" width="146" height="76" rx="10" fill="#d7d3eb" stroke="#4a3aa7" stroke-width="2"/>
<text x="411.0" y="104.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">N-grams</text>
<text x="411.0" y="121.65" font-size="11" text-anchor="middle" fill="#52514e">keep short phrases</text>
<text x="411.0" y="58" font-size="12" text-anchor="middle" fill="#4a3aa7" font-weight="700">Unit 2</text>
<line x1="486" y1="108" x2="498" y2="108" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="500" y="70" width="146" height="76" rx="10" fill="#d7d3eb" stroke="#4a3aa7" stroke-width="2"/>
<text x="573.0" y="104.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">TF-IDF</text>
<text x="573.0" y="121.65" font-size="11" text-anchor="middle" fill="#52514e">weight rare words up</text>
<text x="573.0" y="58" font-size="12" text-anchor="middle" fill="#4a3aa7" font-weight="700">Unit 2</text>
<line x1="648" y1="108" x2="660" y2="108" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="662" y="70" width="146" height="76" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="735.0" y="104.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Embeddings</text>
<text x="735.0" y="121.65" font-size="11" text-anchor="middle" fill="#52514e">word2vec, GloVe</text>
<text x="735.0" y="58" font-size="12" text-anchor="middle" fill="#2a78d6" font-weight="700">Unit 3</text>
<line x1="810" y1="108" x2="822" y2="108" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="824" y="70" width="146" height="76" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="897.0" y="104.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Contextual</text>
<text x="897.0" y="121.65" font-size="11" text-anchor="middle" fill="#52514e">BERT, GPT</text>
<text x="897.0" y="58" font-size="12" text-anchor="middle" fill="#1baf7a" font-weight="700">Unit 5</text>
<path d="M 14 168 L 14 178 L 646 178 L 646 168" fill="none" stroke="#4a3aa7" stroke-width="2"/>
<text x="330.0" y="200" font-size="13" text-anchor="middle" fill="#4a3aa7" font-weight="700">sparse, count-based, no meaning: fast, cheap, explainable</text>
<path d="M 662 168 L 662 178 L 970 178 L 970 168" fill="none" stroke="#2a78d6" stroke-width="2"/>
<text x="816.0" y="200" font-size="13" text-anchor="middle" fill="#2a78d6" font-weight="700">dense, learned, capture meaning</text>
<text x="500" y="236" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">Everything in this unit is still used in production today, usually as the fast baseline or inside search engines.</text>
</svg>
