<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Character, word and subword tokenization compared" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Character, word and subword tokenization compared</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="360" fill="#fcfcfb"/>
<text x="20" y="34" font-size="15" text-anchor="start" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">Input:  "unbelievably tasty biryani!"</text>
<rect x="20" y="60" width="150" height="70" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="95.0" y="99.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Character</text>
<rect x="186" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="200.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">u</text>
<rect x="220" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="234.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">n</text>
<rect x="254" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="268.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">b</text>
<rect x="288" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="302.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">e</text>
<rect x="322" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="336.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">l</text>
<rect x="356" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="370.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">i</text>
<rect x="390" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="404.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">e</text>
<rect x="424" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="438.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">v</text>
<rect x="458" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="472.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">a</text>
<rect x="492" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="506.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">b</text>
<rect x="526" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="540.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">l</text>
<rect x="560" y="77" width="28" height="36" rx="6" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="574.0" y="99.55" font-size="13" text-anchor="middle" fill="#1d1d1f">…</text>
<text x="720" y="90" font-size="12.5" text-anchor="start" fill="#52514e">tiny vocabulary, but very long sequences;</text>
<text x="720" y="109" font-size="12.5" text-anchor="start" fill="#52514e">model must learn spelling from scratch</text>
<rect x="20" y="156" width="150" height="70" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="95.0" y="195.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Word</text>
<rect x="186" y="173" width="130.0" height="36" rx="6" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="251.0" y="195.55" font-size="13" text-anchor="middle" fill="#1d1d1f">unbelievably</text>
<rect x="322.0" y="173" width="63.5" height="36" rx="6" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="353.75" y="195.55" font-size="13" text-anchor="middle" fill="#1d1d1f">tasty</text>
<rect x="391.5" y="173" width="63.5" height="36" rx="6" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="423.25" y="195.55" font-size="13" text-anchor="middle" fill="#1d1d1f">[UNK]</text>
<rect x="461.0" y="173" width="28" height="36" rx="6" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="475.0" y="195.55" font-size="13" text-anchor="middle" fill="#1d1d1f">!</text>
<text x="720" y="186" font-size="12.5" text-anchor="start" fill="#52514e">short sequences, but huge vocabulary;</text>
<text x="720" y="205" font-size="12.5" text-anchor="start" fill="#52514e">new or rare words become [UNK]</text>
<rect x="20" y="252" width="150" height="70" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="95.0" y="283.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Subword</text>
<text x="95.0" y="300.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">(BPE / WordPiece)</text>
<rect x="186" y="269" width="35.0" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="203.5" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">un</text>
<rect x="227.0" y="269" width="73.0" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="263.5" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">believ</text>
<rect x="306.0" y="269" width="54.0" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="333.0" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">ably</text>
<rect x="366.0" y="269" width="63.5" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="397.75" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">tasty</text>
<rect x="435.5" y="269" width="44.5" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="457.75" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">bir</text>
<rect x="486.0" y="269" width="73.0" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="522.5" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">##yani</text>
<rect x="565.0" y="269" width="28" height="36" rx="6" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="579.0" y="291.55" font-size="13" text-anchor="middle" fill="#1d1d1f">!</text>
<text x="720" y="282" font-size="12.5" text-anchor="start" fill="#52514e">best of both: common words stay whole,</text>
<text x="720" y="301" font-size="12.5" text-anchor="start" fill="#52514e">rare words split into known pieces</text>
<text x="20" y="350" font-size="12.5" text-anchor="start" fill="#52514e" font-style="italic">Every modern LLM (GPT, Claude, Gemini, Llama) uses subword tokens. Splits shown are illustrative; each tokenizer differs.</text>
</svg>
