<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="The five classical phases of NLP with examples" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The five classical phases of NLP with examples</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="520" fill="#fcfcfb"/>
<text x="150" y="34" font-size="13" text-anchor="middle" fill="#52514e" font-weight="700">Phase</text>
<text x="470" y="34" font-size="13" text-anchor="middle" fill="#52514e" font-weight="700">Example</text>
<text x="840" y="34" font-size="13" text-anchor="middle" fill="#52514e" font-weight="700">Where industry uses it</text>
<rect x="20" y="50" width="260" height="76" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="150.0" y="75.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">1. Lexical &amp;</text>
<text x="150.0" y="92.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">morphological</text>
<text x="150.0" y="110.4" font-size="11" text-anchor="middle" fill="#52514e">words and their forms</text>
<rect x="300" y="50" width="340" height="76" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="470" y="82" font-size="12.5" text-anchor="middle" fill="#1d1d1f">"undelivered" = un + deliver + ed</text>
<text x="470" y="104" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">tokens, stems, lemmas</text>
<rect x="660" y="50" width="320" height="76" rx="10" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
<text x="820" y="83" font-size="13" text-anchor="middle" fill="#1d1d1f">search, spell-check,</text>
<text x="820" y="103" font-size="13" text-anchor="middle" fill="#1d1d1f">autocomplete</text>
<line x1="150" y1="128" x2="150" y2="138" stroke="#4a3aa7" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="140" width="260" height="76" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="150.0" y="174.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">2. Syntactic</text>
<text x="150.0" y="191.65" font-size="11" text-anchor="middle" fill="#52514e">grammar and structure</text>
<rect x="300" y="140" width="340" height="76" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="470" y="172" font-size="12.5" text-anchor="middle" fill="#1d1d1f">"I saw the man with the telescope"</text>
<text x="470" y="194" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">who has the telescope?</text>
<rect x="660" y="140" width="320" height="76" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="820" y="173" font-size="13" text-anchor="middle" fill="#1d1d1f">grammar tools,</text>
<text x="820" y="193" font-size="13" text-anchor="middle" fill="#1d1d1f">info extraction</text>
<line x1="150" y1="218" x2="150" y2="228" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="230" width="260" height="76" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="150.0" y="264.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">3. Semantic</text>
<text x="150.0" y="281.65" font-size="11" text-anchor="middle" fill="#52514e">meaning of words/sentences</text>
<rect x="300" y="230" width="340" height="76" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="470" y="262" font-size="12.5" text-anchor="middle" fill="#1d1d1f">"bank" → money or river?</text>
<text x="470" y="284" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">"Paytm" → a payment app</text>
<rect x="660" y="230" width="320" height="76" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
<text x="820" y="263" font-size="13" text-anchor="middle" fill="#1d1d1f">intent detection,</text>
<text x="820" y="283" font-size="13" text-anchor="middle" fill="#1d1d1f">entity linking</text>
<line x1="150" y1="308" x2="150" y2="318" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="320" width="260" height="76" rx="10" fill="#fcf3e0" stroke="#eda100" stroke-width="2"/>
<text x="150.0" y="354.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">4. Discourse</text>
<text x="150.0" y="371.65" font-size="11" text-anchor="middle" fill="#52514e">meaning across sentences</text>
<rect x="300" y="320" width="340" height="76" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="470" y="352" font-size="12.5" text-anchor="middle" fill="#1d1d1f">"I ordered paneer tikka. It was cold."</text>
<text x="470" y="374" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">"It" → the paneer tikka</text>
<rect x="660" y="320" width="320" height="76" rx="10" fill="#ffffff" stroke="#eda100" stroke-width="2"/>
<text x="820" y="353" font-size="13" text-anchor="middle" fill="#1d1d1f">multi-turn chatbots,</text>
<text x="820" y="373" font-size="13" text-anchor="middle" fill="#1d1d1f">summarization</text>
<line x1="150" y1="398" x2="150" y2="408" stroke="#eda100" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="410" width="260" height="76" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="150.0" y="444.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">5. Pragmatic</text>
<text x="150.0" y="461.65" font-size="11" text-anchor="middle" fill="#52514e">intent in real context</text>
<rect x="300" y="410" width="340" height="76" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="470" y="442" font-size="12.5" text-anchor="middle" fill="#1d1d1f">"Great, just great 🙄 order late again"</text>
<text x="470" y="464" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">= complaint, not praise</text>
<rect x="660" y="410" width="320" height="76" rx="10" fill="#ffffff" stroke="#e34948" stroke-width="2"/>
<text x="820" y="443" font-size="13" text-anchor="middle" fill="#1d1d1f">complaint &amp; sarcasm</text>
<text x="820" y="463" font-size="13" text-anchor="middle" fill="#1d1d1f">detection, escalation</text>
<text x="20" y="510" font-size="12.5" text-anchor="start" fill="#52514e" font-style="italic">Deeper phases need more context, and are harder. LLMs learn all five implicitly, but debugging still maps back to them.</text>
</svg>
