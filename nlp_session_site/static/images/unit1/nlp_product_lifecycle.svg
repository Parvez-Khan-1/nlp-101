<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Where NLP fits in the product engineering lifecycle">
<title>Where NLP fits in the product engineering lifecycle</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="520" fill="#fcfcfb"/>
<rect x="20" y="40" width="109.19999999999999" height="19" rx="9" fill="#d1cde9" stroke="none"/>
<text x="74.6" y="54" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">REQUIREMENTS</text>
<rect x="20" y="64" width="225" height="108" rx="12" fill="#ecebf6" stroke="#4a3aa7" stroke-width="2"/>
<text x="132.5" y="90" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">1. Define the problem</text>
<text x="132.5" y="114" font-size="12" text-anchor="middle" fill="#52514e">"Auto-route tickets"</text>
<text x="132.5" y="133" font-size="12" text-anchor="middle" fill="#52514e">success = 90% correct,</text>
<text x="132.5" y="152" font-size="12" text-anchor="middle" fill="#52514e">&lt; 200 ms per ticket</text>
<line x1="247" y1="118" x2="263" y2="118" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="265" y="40" width="48.4" height="19" rx="9" fill="#fad9cc" stroke="none"/>
<text x="289.2" y="54" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">DATA</text>
<rect x="265" y="64" width="225" height="108" rx="12" fill="#fdefea" stroke="#eb6834" stroke-width="2"/>
<text x="377.5" y="90" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">2. Collect &amp; label data</text>
<text x="377.5" y="114" font-size="12" text-anchor="middle" fill="#52514e">tickets, reviews, chats</text>
<text x="377.5" y="133" font-size="12" text-anchor="middle" fill="#52514e">annotators + domain experts</text>
<text x="377.5" y="152" font-size="12" text-anchor="middle" fill="#52514e">privacy / PII review</text>
<line x1="492" y1="118" x2="508" y2="118" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="510" y="40" width="56.0" height="19" rx="9" fill="#fae7bf" stroke="none"/>
<text x="538.0" y="54" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">BUILD</text>
<rect x="510" y="64" width="225" height="108" rx="12" fill="#f9e2b2" stroke="#eda100" stroke-width="4"/>
<text x="622.5" y="90" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">3. Pre-process &amp; explore</text>
<text x="622.5" y="114" font-size="12" text-anchor="middle" fill="#52514e">clean, normalize, tokenize</text>
<text x="622.5" y="133" font-size="12" text-anchor="middle" fill="#52514e">regex, entities, stats</text>
<text x="622.5" y="152" font-size="12" text-anchor="middle" fill="#1d1d1f" font-weight="700">← THIS UNIT</text>
<line x1="737" y1="118" x2="753" y2="118" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="755" y="40" width="56.0" height="19" rx="9" fill="#c9ddf4" stroke="none"/>
<text x="783.0" y="54" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">BUILD</text>
<rect x="755" y="64" width="225" height="108" rx="12" fill="#e9f1fa" stroke="#2a78d6" stroke-width="2"/>
<text x="867.5" y="90" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">4. Baseline first</text>
<text x="867.5" y="114" font-size="12" text-anchor="middle" fill="#52514e">rules / regex, TF-IDF + LR</text>
<text x="867.5" y="133" font-size="12" text-anchor="middle" fill="#52514e">sets the bar to beat</text>
<text x="867.5" y="152" font-size="12" text-anchor="middle" fill="#52514e">often good enough!</text>
<rect x="755" y="276" width="56.0" height="19" rx="9" fill="#c9ddf4" stroke="none"/>
<text x="783.0" y="290" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">BUILD</text>
<rect x="755" y="300" width="225" height="108" rx="12" fill="#e9f1fa" stroke="#2a78d6" stroke-width="2"/>
<text x="867.5" y="326" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">5. Model</text>
<text x="867.5" y="350" font-size="12" text-anchor="middle" fill="#52514e">fine-tune BERT, or</text>
<text x="867.5" y="369" font-size="12" text-anchor="middle" fill="#52514e">prompt / RAG with an LLM</text>
<text x="867.5" y="388" font-size="12" text-anchor="middle" fill="#52514e">cost vs accuracy trade-off</text>
<line x1="753" y1="354" x2="737" y2="354" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="510" y="276" width="48.4" height="19" rx="9" fill="#c6ebdd" stroke="none"/>
<text x="534.2" y="290" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">TEST</text>
<rect x="510" y="300" width="225" height="108" rx="12" fill="#e8f7f1" stroke="#1baf7a" stroke-width="2"/>
<text x="622.5" y="326" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">6. Evaluate</text>
<text x="622.5" y="350" font-size="12" text-anchor="middle" fill="#52514e">precision / recall per class</text>
<text x="622.5" y="369" font-size="12" text-anchor="middle" fill="#52514e">error analysis, bias checks</text>
<text x="622.5" y="388" font-size="12" text-anchor="middle" fill="#52514e">human review of samples</text>
<line x1="508" y1="354" x2="492" y2="354" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="265" y="276" width="71.19999999999999" height="19" rx="9" fill="#bfe0bf" stroke="none"/>
<text x="300.6" y="290" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">RELEASE</text>
<rect x="265" y="300" width="225" height="108" rx="12" fill="#e5f2e5" stroke="#008300" stroke-width="2"/>
<text x="377.5" y="326" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">7. Deploy</text>
<text x="377.5" y="350" font-size="12" text-anchor="middle" fill="#52514e">API / microservice</text>
<text x="377.5" y="369" font-size="12" text-anchor="middle" fill="#52514e">latency, cost, fallbacks</text>
<text x="377.5" y="388" font-size="12" text-anchor="middle" fill="#52514e">A/B test vs old system</text>
<line x1="263" y1="354" x2="247" y2="354" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="276" width="71.19999999999999" height="19" rx="9" fill="#f8d1d1" stroke="none"/>
<text x="55.599999999999994" y="290" font-size="10" text-anchor="middle" fill="#1d1d1f" font-weight="700">OPERATE</text>
<rect x="20" y="300" width="225" height="108" rx="12" fill="#fcecec" stroke="#e34948" stroke-width="2"/>
<text x="132.5" y="326" font-size="14.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">8. Monitor &amp; improve</text>
<text x="132.5" y="350" font-size="12" text-anchor="middle" fill="#52514e">data drift, new slang</text>
<text x="132.5" y="369" font-size="12" text-anchor="middle" fill="#52514e">user feedback, escalations</text>
<text x="132.5" y="388" font-size="12" text-anchor="middle" fill="#52514e">retrain on fresh data</text>
<path d="M 867 174 L 867 272" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 132 300 C 132 240, 377 250, 377 176" fill="none" stroke="#e34948" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="392" y="222" font-size="12" text-anchor="start" fill="#e34948" font-style="italic">feedback loop: new data, retrain</text>
<text x="500" y="450" font-size="13" text-anchor="middle" fill="#52514e">NLP is not one step. It is a product feature that goes through the full engineering cycle, and most of the</text>
<text x="500" y="471" font-size="13" text-anchor="middle" fill="#52514e">effort (steps 2, 3, 6 and 8) is about data and evaluation, not the model itself.</text>
<text x="500" y="500" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Roles: product manager · data engineer · annotators &amp; domain experts · ML engineer · MLOps · QA</text>
</svg>
