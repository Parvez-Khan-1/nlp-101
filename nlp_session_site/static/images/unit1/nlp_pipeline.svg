<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="A production NLP pipeline with an example support ticket" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A production NLP pipeline with an example support ticket</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="330" fill="#fcfcfb"/>
<rect x="14" y="40" width="122" height="74" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="75.0" y="81.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Raw text</text>
<line x1="138" y1="77" x2="155" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="14" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="75.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">"Order #4521 late</text>
<text x="75.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">tha!! refund</text>
<text x="75.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">chahiye 😡"</text>
<rect x="157" y="40" width="122" height="74" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="218.0" y="73.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Clean &amp;</text>
<text x="218.0" y="90.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">normalize</text>
<line x1="281" y1="77" x2="298" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="157" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="218.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">lowercase, fix</text>
<text x="218.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">emoji → [ANGRY],</text>
<text x="218.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">keep order ids</text>
<rect x="300" y="40" width="122" height="74" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="361.0" y="81.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Tokenize</text>
<line x1="424" y1="77" x2="441" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="300" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="361.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">['order', '#4521',</text>
<text x="361.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">'late', 'tha',</text>
<text x="361.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">'refund', 'chahiye']</text>
<rect x="443" y="40" width="122" height="74" rx="10" fill="#fcf3e0" stroke="#eda100" stroke-width="2"/>
<text x="504.0" y="73.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">POS · NER</text>
<text x="504.0" y="90.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">· parse</text>
<line x1="567" y1="77" x2="584" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="443" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="504.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">ORDER_ID = #4521</text>
<text x="504.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">intent word:</text>
<text x="504.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">refund</text>
<rect x="586" y="40" width="122" height="74" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="647.0" y="73.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Features /</text>
<text x="647.0" y="90.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">vectors</text>
<line x1="710" y1="77" x2="727" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="586" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="647.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">TF-IDF or</text>
<text x="647.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">embeddings</text>
<text x="647.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">[0.12, -0.8, …]</text>
<rect x="729" y="40" width="122" height="74" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="790.0" y="81.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Model</text>
<line x1="853" y1="77" x2="870" y2="77" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="729" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="790.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">classifier →</text>
<text x="790.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">Refund (0.94)</text>
<text x="790.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">Angry (0.88)</text>
<rect x="872" y="40" width="122" height="74" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="933.0" y="73.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Business</text>
<text x="933.0" y="90.65" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">action</text>
<rect x="872" y="134" width="122" height="92" rx="8" fill="#f1f0ec" stroke="none"/>
<text x="933.0" y="160" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">route to Refunds</text>
<text x="933.0" y="180" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">queue, priority</text>
<text x="933.0" y="200" font-size="11" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">= HIGH</text>
<text x="500" y="268" font-size="13" text-anchor="middle" fill="#52514e">Real tickets are messy: typos, Hinglish, emojis, IDs, sarcasm. Most of the engineering effort</text>
<text x="500" y="290" font-size="13" text-anchor="middle" fill="#52514e">goes into the first four boxes, not the model.</text>
</svg>
