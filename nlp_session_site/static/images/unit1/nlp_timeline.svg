<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Evolution of NLP from rules to LLMs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Evolution of NLP from rules to LLMs</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="300" fill="#fcfcfb"/>
<line x1="40" y1="150" x2="960" y2="150" stroke="#8a8983" stroke-width="3"/>
<circle cx="80" cy="150" r="9" fill="#dedbef" stroke="#4a3aa7" stroke-width="2"/>
<line x1="80" y1="139" x2="80" y2="104" stroke="#4a3aa7" stroke-width="1.5"/>
<text x="80" y="60" font-size="15" text-anchor="middle" fill="#4a3aa7" font-weight="700">1954</text>
<text x="80" y="78" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Georgetown MT</text>
<text x="80" y="95" font-size="11.5" text-anchor="middle" fill="#52514e">60 rule-based sentences</text>
<circle cx="200" cy="150" r="9" fill="#dedbef" stroke="#4a3aa7" stroke-width="2"/>
<line x1="200" y1="161" x2="200" y2="202" stroke="#4a3aa7" stroke-width="1.5"/>
<text x="200" y="220" font-size="15" text-anchor="middle" fill="#4a3aa7" font-weight="700">1966</text>
<text x="200" y="238" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">ELIZA</text>
<text x="200" y="255" font-size="11.5" text-anchor="middle" fill="#52514e">first chatbot, pattern rules</text>
<circle cx="320" cy="150" r="9" fill="#fbe3da" stroke="#eb6834" stroke-width="2"/>
<line x1="320" y1="139" x2="320" y2="104" stroke="#eb6834" stroke-width="1.5"/>
<text x="320" y="60" font-size="15" text-anchor="middle" fill="#eb6834" font-weight="700">1990s</text>
<text x="320" y="78" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Statistical NLP</text>
<text x="320" y="95" font-size="11.5" text-anchor="middle" fill="#52514e">n-grams, HMMs, Naive Bayes</text>
<circle cx="440" cy="150" r="9" fill="#d8e6f7" stroke="#2a78d6" stroke-width="2"/>
<line x1="440" y1="161" x2="440" y2="202" stroke="#2a78d6" stroke-width="1.5"/>
<text x="440" y="220" font-size="15" text-anchor="middle" fill="#2a78d6" font-weight="700">2013</text>
<text x="440" y="238" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">word2vec</text>
<text x="440" y="255" font-size="11.5" text-anchor="middle" fill="#52514e">words become vectors</text>
<circle cx="560" cy="150" r="9" fill="#d8e6f7" stroke="#2a78d6" stroke-width="2"/>
<line x1="560" y1="139" x2="560" y2="104" stroke="#2a78d6" stroke-width="1.5"/>
<text x="560" y="60" font-size="15" text-anchor="middle" fill="#2a78d6" font-weight="700">2014</text>
<text x="560" y="78" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Seq2Seq + attention</text>
<text x="560" y="95" font-size="11.5" text-anchor="middle" fill="#52514e">neural translation</text>
<circle cx="680" cy="150" r="9" fill="#d5f0e7" stroke="#1baf7a" stroke-width="2"/>
<line x1="680" y1="161" x2="680" y2="202" stroke="#1baf7a" stroke-width="1.5"/>
<text x="680" y="220" font-size="15" text-anchor="middle" fill="#1baf7a" font-weight="700">2017</text>
<text x="680" y="238" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Transformer</text>
<text x="680" y="255" font-size="11.5" text-anchor="middle" fill="#52514e">"Attention Is All You Need"</text>
<circle cx="800" cy="150" r="9" fill="#d5f0e7" stroke="#1baf7a" stroke-width="2"/>
<line x1="800" y1="139" x2="800" y2="104" stroke="#1baf7a" stroke-width="1.5"/>
<text x="800" y="60" font-size="15" text-anchor="middle" fill="#1baf7a" font-weight="700">2018</text>
<text x="800" y="78" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">BERT &amp; GPT</text>
<text x="800" y="95" font-size="11.5" text-anchor="middle" fill="#52514e">pre-train, then fine-tune</text>
<circle cx="920" cy="150" r="9" fill="#d5f0e7" stroke="#1baf7a" stroke-width="2"/>
<line x1="920" y1="161" x2="920" y2="202" stroke="#1baf7a" stroke-width="1.5"/>
<text x="920" y="220" font-size="15" text-anchor="middle" fill="#1baf7a" font-weight="700">2022+</text>
<text x="920" y="238" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">ChatGPT &amp; LLMs</text>
<text x="920" y="255" font-size="11.5" text-anchor="middle" fill="#52514e">RAG, agents, multimodal</text>
<text x="40" y="286" font-size="13" text-anchor="start" fill="#52514e" font-style="italic">Rules  →  Statistics  →  Neural networks  →  Transformers &amp; LLMs</text>
</svg>
