<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="How a support bot uses NLU and NLG" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a support bot uses NLU and NLG</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="240" fill="#fcfcfb"/>
<g transform="translate(0,-60)">
<rect x="20" y="100" width="170" height="90" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="105.0" y="141.425" font-size="13" text-anchor="middle" fill="#1d1d1f">"Mera order kab</text>
<text x="105.0" y="157.675" font-size="13" text-anchor="middle" fill="#1d1d1f">aayega? #4521"</text>
<text x="105" y="215" font-size="12" text-anchor="middle" fill="#52514e">customer message</text>
<line x1="192" y1="145" x2="232" y2="145" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="234" y="100" width="110" height="90" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="289.0" y="140.05" font-size="18" text-anchor="middle" fill="#1d1d1f" font-weight="700">NLU</text>
<text x="289.0" y="162.55" font-size="15" text-anchor="middle" fill="#52514e">understand</text>
<line x1="346" y1="145" x2="386" y2="145" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="388" y="92" width="190" height="106" rx="10" fill="#f1f0ec" stroke="none"/>
<text x="483" y="122" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">intent: track_order</text>
<text x="483" y="148" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">order_id: 4521</text>
<text x="483" y="174" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">language: hi-en</text>
<text x="483" y="215" font-size="12" text-anchor="middle" fill="#52514e">structured meaning</text>
<line x1="580" y1="145" x2="616" y2="145" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="618" y="100" width="120" height="90" rx="10" fill="#fcf3e0" stroke="#eda100" stroke-width="2"/>
<text x="678.0" y="132.4" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">Order</text>
<text x="678.0" y="149.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">system</text>
<text x="678.0" y="167.4" font-size="11" text-anchor="middle" fill="#52514e">status, ETA</text>
<line x1="740" y1="145" x2="776" y2="145" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="778" y="100" width="110" height="90" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="833.0" y="140.05" font-size="18" text-anchor="middle" fill="#1d1d1f" font-weight="700">NLG</text>
<text x="833.0" y="162.55" font-size="15" text-anchor="middle" fill="#52514e">generate</text>
<line x1="890" y1="145" x2="926" y2="145" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="960" y="122" font-size="12" text-anchor="middle" fill="#1d1d1f" font-style="italic">"Out for</text>
<text x="960" y="140" font-size="12" text-anchor="middle" fill="#1d1d1f" font-style="italic">delivery,</text>
<text x="960" y="158" font-size="12" text-anchor="middle" fill="#1d1d1f" font-style="italic">~12 min"</text>
<text x="500" y="262" font-size="13" text-anchor="middle" fill="#52514e">NLP = Natural Language Understanding (text → meaning) + Natural Language Generation (meaning → text).</text>
<text x="500" y="284" font-size="13" text-anchor="middle" fill="#52514e">Modern LLMs do both in one model, but production systems still separate them for control, logging and cost.</text>
</g>
</svg>
