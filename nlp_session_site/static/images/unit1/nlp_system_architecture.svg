<text x="121.75" y="266.675" font-size="10" text-anchor="middle" fill="#52514e">creates &amp; routes tickets</text>
<rect x="221.5" y="226" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
