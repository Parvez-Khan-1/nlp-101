<line x1="121.75" y1="182" x2="121.75" y2="224" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="143.75" cy="203" r="11" fill="#1d1d1f"/>
<text x="143.75" y="207.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<line x1="101.75" y1="284" x2="101.75" y2="346" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="79.75" cy="316" r="11" fill="#1d1d1f"/>
<text x="79.75" y="320.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<line x1="141.75" y1="346" x2="141.75" y2="286" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<circle cx="163.75" cy="316" r="11" fill="#1d1d1f"/>
<text x="163.75" y="320.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<path d="M 768.25 254 L 783.25 254 L 783.25 82 L 769.25 82" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="783.25" cy="168" r="11" fill="#1d1d1f"/>
<text x="783.25" y="172.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
<line x1="307.25" y1="462" x2="307.25" y2="510" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="317.25" y="490" font-size="11" text-anchor="start" fill="#52514e" font-style="italic">log</text>
<line x1="492.75" y1="570" x2="151.75" y2="626" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<circle cx="327.25" cy="598" r="11" fill="#1d1d1f"/>
<text x="327.25" y="602.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">6</text>
<path d="M 768.25 656 L 790 656 L 790 385 L 766.0 385" fill="none" stroke="#e34948" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="796" y="540" font-size="11" text-anchor="start" fill="#e34948" font-style="italic">deploy</text>
<text x="842" y="46" font-size="15" text-anchor="start" fill="#1d1d1f" font-weight="700">One ticket's journey</text>
<circle cx="853" cy="78" r="11" fill="#1d1d1f"/>
<text x="853" y="82.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
<text x="872" y="82" font-size="12" text-anchor="start" fill="#1d1d1f">Customer types in the app:</text>
<text x="872" y="99" font-size="12" text-anchor="start" fill="#52514e">"Order #4521 late,</text>
<text x="872" y="116" font-size="12" text-anchor="start" fill="#52514e">refund chahiye 😡"</text>
<circle cx="853" cy="153" r="11" fill="#1d1d1f"/>
<text x="853" y="157.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<text x="872" y="157" font-size="12" text-anchor="start" fill="#1d1d1f">Gateway authenticates and</text>
<text x="872" y="174" font-size="12" text-anchor="start" fill="#52514e">forwards to the Ticket service.</text>
<circle cx="853" cy="211" r="11" fill="#1d1d1f"/>
<text x="853" y="215.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<text x="872" y="215" font-size="12" text-anchor="start" fill="#1d1d1f">Ticket service calls the NLP</text>
<text x="872" y="232" font-size="12" text-anchor="start" fill="#52514e">engine. Budget: ~100 ms.</text>
<circle cx="853" cy="269" r="11" fill="#1d1d1f"/>
<text x="853" y="273.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<text x="872" y="273" font-size="12" text-anchor="start" fill="#1d1d1f">NLP engine returns JSON:</text>
<text x="872" y="290" font-size="12" text-anchor="start" fill="#52514e">intent, order ID, sentiment,</text>
<text x="872" y="307" font-size="12" text-anchor="start" fill="#52514e">priority.</text>
<circle cx="853" cy="344" r="11" fill="#1d1d1f"/>
<text x="853" y="348.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
<text x="872" y="348" font-size="12" text-anchor="start" fill="#1d1d1f">Ticket is routed to the</text>
<text x="872" y="365" font-size="12" text-anchor="start" fill="#52514e">Refunds queue; the agent sees</text>
<text x="872" y="382" font-size="12" text-anchor="start" fill="#52514e">it in the CRM with a drafted</text>
<text x="872" y="399" font-size="12" text-anchor="start" fill="#52514e">reply. Or it is auto-resolved.</text>
<circle cx="853" cy="436" r="11" fill="#1d1d1f"/>
<text x="853" y="440.5" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">6</text>
<text x="872" y="440" font-size="12" text-anchor="start" fill="#1d1d1f">Text + prediction are logged,</text>
<text x="872" y="457" font-size="12" text-anchor="start" fill="#52514e">sampled for labelling, and used</text>
<text x="872" y="474" font-size="12" text-anchor="start" fill="#52514e">to retrain the next model</text>
<text x="872" y="491" font-size="12" text-anchor="start" fill="#52514e">version, which is deployed</text>
<text x="872" y="508" font-size="12" text-anchor="start" fill="#52514e">back to the NLP engine.</text>
<text x="842" y="559" font-size="12" text-anchor="start" fill="#52514e" font-style="italic">Everything outside the</text>
<text x="842" y="576" font-size="12" text-anchor="start" fill="#52514e" font-style="italic">yellow box is standard</text>
<text x="842" y="593" font-size="12" text-anchor="start" fill="#52514e" font-style="italic">software engineering.</text>
</svg>
