<text x="307.25" y="266.675" font-size="10" text-anchor="middle" fill="#52514e">status, refunds</text>
<rect x="407.0" y="226" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="492.75" y="250.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Notification service</text>
<text x="492.75" y="266.675" font-size="10" text-anchor="middle" fill="#52514e">SMS, push, email</text>
