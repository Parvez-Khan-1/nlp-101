<rect x="20" y="318" width="760" height="150" rx="12" fill="#fcefd6" stroke="#eda100" stroke-width="3"/>
<text x="766" y="335" font-size="11.5" text-anchor="end" fill="#eda100" font-weight="700">NLP ENGINE  (its own microservice, called over REST / gRPC)</text>
<rect x="36.0" y="348" width="171.5" height="74" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="121.75" y="373.3" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Pre-processing</text>
<text x="121.75" y="389.55" font-size="10" text-anchor="middle" fill="#52514e">normalize · regex</text>
<text x="121.75" y="405.8" font-size="10" text-anchor="middle" fill="#52514e">PII masking</text>
<rect x="221.5" y="348" width="171.5" height="74" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="307.25" y="373.3" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">NLP models</text>
<text x="307.25" y="389.55" font-size="10" text-anchor="middle" fill="#52514e">intent · NER</text>
<text x="307.25" y="405.8" font-size="10" text-anchor="middle" fill="#52514e">sentiment</text>
<rect x="407.0" y="348" width="171.5" height="74" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="492.75" y="373.3" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">LLM gateway</text>
<text x="492.75" y="389.55" font-size="10" text-anchor="middle" fill="#52514e">reply drafts</text>
<text x="492.75" y="405.8" font-size="10" text-anchor="middle" fill="#52514e">long-tail cases</text>
<rect x="592.5" y="348" width="171.5" height="74" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="678.25" y="373.3" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Guardrails</text>
<text x="678.25" y="389.55" font-size="10" text-anchor="middle" fill="#52514e">PII · policy</text>
<text x="678.25" y="405.8" font-size="10" text-anchor="middle" fill="#52514e">confidence checks</text>
<line x1="208.5" y1="385" x2="220.5" y2="385" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)"/>
<line x1="394.0" y1="385" x2="406.0" y2="385" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)"/>
<line x1="579.5" y1="385" x2="591.5" y2="385" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36" y="432" width="728" height="28" rx="6" fill="#fffdf5" stroke="none"/>
<text x="400.0" y="451" font-size="12" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">returns JSON:  {"intent": "refund", "order_id": "4521", "sentiment": "angry", "priority": "high"}</text>
<rect x="20" y="488" width="760" height="96" rx="12" fill="#eff9f5" stroke="#1baf7a" stroke-width="1.5"/>
<text x="766" y="505" font-size="11.5" text-anchor="end" fill="#1baf7a" font-weight="700">DATA LAYER</text>
<rect x="36.0" y="512" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
<text x="121.75" y="536.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Orders DB</text>
<text x="121.75" y="552.675" font-size="10" text-anchor="middle" fill="#52514e">PostgreSQL, MySQL</text>
<rect x="221.5" y="512" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
<text x="307.25" y="536.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Event stream</text>
<text x="307.25" y="552.675" font-size="10" text-anchor="middle" fill="#52514e">Kafka: every ticket + prediction</text>
<rect x="407.0" y="512" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
<text x="492.75" y="536.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Data lake / warehouse</text>
<text x="492.75" y="552.675" font-size="10" text-anchor="middle" fill="#52514e">raw text, labels, metrics</text>
<rect x="592.5" y="512" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
<text x="678.25" y="536.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Vector DB</text>
<text x="678.25" y="552.675" font-size="10" text-anchor="middle" fill="#52514e">embeddings for search / RAG</text>
<rect x="20" y="604" width="760" height="96" rx="12" fill="#fdf2f2" stroke="#e34948" stroke-width="1.5"/>
<text x="766" y="621" font-size="11.5" text-anchor="end" fill="#e34948" font-weight="700">ML PLATFORM  (offline: hours to days)</text>
<rect x="36.0" y="628" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="2"/>
<text x="121.75" y="652.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Labelling tool</text>
<text x="121.75" y="668.675" font-size="10" text-anchor="middle" fill="#52514e">annotators, doctors, agents</text>
<rect x="221.5" y="628" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="2"/>
<text x="307.25" y="652.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Training pipeline</text>
<text x="307.25" y="668.675" font-size="10" text-anchor="middle" fill="#52514e">fine-tune, experiment</text>
<rect x="407.0" y="628" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="2"/>
<text x="492.75" y="652.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Evaluation</text>
<text x="492.75" y="668.675" font-size="10" text-anchor="middle" fill="#52514e">metrics, bias, sign-off</text>
<rect x="592.5" y="628" width="171.5" height="56" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="2"/>
<text x="678.25" y="652.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">Model registry</text>
<text x="678.25" y="668.675" font-size="10" text-anchor="middle" fill="#52514e">versioned models</text>
<line x1="121.75" y1="110" x2="121.75" y2="144" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
