<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Where NLP sits within AI, machine learning, deep learning and generative AI">
<title>Where NLP sits within AI, machine learning, deep learning and generative AI</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="470" fill="#fcfcfb"/>
<rect x="20" y="50" width="640" height="400" rx="16" fill="#ecebf6" stroke="#4a3aa7" stroke-width="2"/>
<text x="36" y="74" font-size="15" text-anchor="start" fill="#4a3aa7" font-weight="700">Artificial Intelligence</text>
<text x="36" y="93" font-size="11.5" text-anchor="start" fill="#52514e">machines doing tasks that need human intelligence</text>
<rect x="55" y="130" width="570" height="310" rx="16" fill="#e9f1fa" stroke="#2a78d6" stroke-width="2"/>
<text x="71" y="154" font-size="15" text-anchor="start" fill="#2a78d6" font-weight="700">Machine Learning</text>
<text x="71" y="173" font-size="11.5" text-anchor="start" fill="#52514e">learn patterns from data</text>
<rect x="90" y="210" width="500" height="220" rx="16" fill="#e8f7f1" stroke="#1baf7a" stroke-width="2"/>
<text x="106" y="234" font-size="15" text-anchor="start" fill="#1baf7a" font-weight="700">Deep Learning</text>
<text x="106" y="253" font-size="11.5" text-anchor="start" fill="#52514e">multi-layer neural networks</text>
<rect x="125" y="290" width="430" height="130" rx="16" fill="#fdefea" stroke="#eb6834" stroke-width="2"/>
<text x="141" y="314" font-size="15" text-anchor="start" fill="#eb6834" font-weight="700">Generative AI / LLMs</text>
<text x="141" y="333" font-size="11.5" text-anchor="start" fill="#52514e">create new text, images, code</text>
<text x="36" y="112" font-size="11.5" text-anchor="start" fill="#52514e" font-style="italic">vision · robotics · planning</text>
<text x="71" y="192" font-size="11.5" text-anchor="start" fill="#52514e" font-style="italic">fraud, forecasting, recsys</text>
<text x="106" y="272" font-size="11.5" text-anchor="start" fill="#52514e" font-style="italic">image recognition</text>
<text x="141" y="392" font-size="11.5" text-anchor="start" fill="#52514e" font-style="italic">image &amp; video generation</text>
<rect x="365" y="8" width="180" height="420" rx="14" fill="#eda100" fill-opacity="0.20" stroke="#eda100" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="455.0" y="30" font-size="17" text-anchor="middle" fill="#8a5a00" font-weight="700">NLP</text>
<text x="455.0" y="46" font-size="11.5" text-anchor="middle" fill="#52514e">+ linguistics</text>
<text x="455.0" y="88" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">rules, grammars,</text>
<text x="455.0" y="105" font-size="11.5" text-anchor="middle" fill="#52514e">regex (1950s–80s)</text>
<text x="455.0" y="168" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">n-grams, Naive Bayes,</text>
<text x="455.0" y="185" font-size="11.5" text-anchor="middle" fill="#52514e">HMMs (1990s–2000s)</text>
<text x="455.0" y="248" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">word2vec, RNN,</text>
<text x="455.0" y="265" font-size="11.5" text-anchor="middle" fill="#52514e">LSTM (2013–17)</text>
<text x="455.0" y="335" font-size="12.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">BERT, GPT, Claude,</text>
<text x="455.0" y="352" font-size="11.5" text-anchor="middle" fill="#52514e">Gemini (2018–today)</text>
<text x="690" y="70" font-size="15" text-anchor="start" fill="#1d1d1f" font-weight="700">How to read this</text>
<text x="690" y="98" font-size="13" text-anchor="start" fill="#1d1d1f">AI is the goal. ML, DL and GenAI are</text>
<text x="690" y="120" font-size="13" text-anchor="start" fill="#52514e">increasingly specific ways to reach it.</text>
<text x="690" y="142" font-size="13" text-anchor="start" fill="#52514e"></text>
<text x="690" y="164" font-size="13" text-anchor="start" fill="#1d1d1f">NLP is a problem area, not a technique.</text>
<text x="690" y="186" font-size="13" text-anchor="start" fill="#52514e">It cuts across every layer: NLP existed</text>
<text x="690" y="208" font-size="13" text-anchor="start" fill="#52514e">with hand-written rules long before</text>
<text x="690" y="230" font-size="13" text-anchor="start" fill="#52514e">machine learning.</text>
<text x="690" y="252" font-size="13" text-anchor="start" fill="#52514e"></text>
<text x="690" y="274" font-size="13" text-anchor="start" fill="#52514e">Today the layers have converged: LLMs</text>
<text x="690" y="296" font-size="13" text-anchor="start" fill="#52514e">are deep learning models trained on</text>
<text x="690" y="318" font-size="13" text-anchor="start" fill="#52514e">language, and language has become the</text>
<text x="690" y="340" font-size="13" text-anchor="start" fill="#52514e">main interface to AI itself.</text>
</svg>
