<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Skip-gram with a context window and negative sampling">
<title>Skip-gram with a context window and negative sampling</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs>
<rect width="1000" height="380" fill="#fcfcfb"/>
<rect x="70" y="30" width="110" height="44" rx="10" fill="#f6f6f5" stroke="#b9b7b0" stroke-width="2"/>
