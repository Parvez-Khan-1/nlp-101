<rect x="445" y="30" width="110" height="44" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="500.0" y="57.25" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">delivered</text>
<rect x="570" y="30" width="110" height="44" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="625.0" y="57.25" font-size="15" text-anchor="middle" fill="#1d1d1f">cold</text>
<rect x="695" y="30" width="110" height="44" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="750.0" y="57.25" font-size="15" text-anchor="middle" fill="#1d1d1f">and</text>
<rect x="820" y="30" width="110" height="44" rx="10" fill="#f6f6f5" stroke="#b9b7b0" stroke-width="2"/>
<text x="875.0" y="57.25" font-size="15" text-anchor="middle" fill="#1d1d1f">late</text>
<path d="M 320 86 L 320 96 L 690 96 L 690 86" fill="none" stroke="#1baf7a" stroke-width="2"/>
<text x="505" y="116" font-size="12.5" text-anchor="middle" fill="#52514e">context window = 2 words each side</text>
<rect x="425" y="150" width="150" height="50" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="500.0" y="171.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">center word</text>
<text x="500.0" y="187.675" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">"delivered"</text>
<line x1="500" y1="200" x2="500" y2="232" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400" y="234" width="200" height="48" rx="10" fill="#c9ddf4" stroke="#2a78d6" stroke-width="2"/>
<text x="500.0" y="262.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">embedding (300-d)</text>
<text x="500" y="306" font-size="12.5" text-anchor="middle" fill="#52514e">predict neighbours</text>
<path d="M 420 258 Q 110 258 110 318" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="62" y="320" width="96" height="38" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="110.0" y="343.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">food  ✓ 1</text>
<path d="M 420 258 Q 250 258 250 318" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="202" y="320" width="96" height="38" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="250.0" y="343.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">was  ✓ 1</text>
<path d="M 580 258 Q 750 258 750 318" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="702" y="320" width="96" height="38" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="750.0" y="343.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">cold  ✓ 1</text>
<path d="M 580 258 Q 890 258 890 318" fill="none" stroke="#1baf7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="842" y="320" width="96" height="38" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="890.0" y="343.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">and  ✓ 1</text>
<rect x="760" y="150" width="210" height="64" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="865.0" y="170.3" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">negative sampling</text>
<text x="865.0" y="186.55" font-size="10" text-anchor="middle" fill="#52514e">"giraffe", "algebra" ✗ 0</text>
<text x="865.0" y="202.8" font-size="10" text-anchor="middle" fill="#52514e">random words: push apart</text>
<path d="M 600 175 L 755 180" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="40" y="178" font-size="12.5" text-anchor="start" fill="#52514e">Train on billions of</text>
<text x="40" y="196" font-size="12.5" text-anchor="start" fill="#52514e">(center, context) pairs.</text>
<text x="40" y="214" font-size="12.5" text-anchor="start" fill="#52514e">The hidden layer IS</text>
<text x="40" y="232" font-size="12.5" text-anchor="start" fill="#1d1d1f" font-weight="700">the embedding.</text>
