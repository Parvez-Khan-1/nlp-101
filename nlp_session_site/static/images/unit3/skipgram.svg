<rect x="195" y="30" width="110" height="44" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="250.0" y="57.25" font-size="15" text-anchor="middle" fill="#1d1d1f">food</text>
<rect x="320" y="30" width="110" height="44" rx="10" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
