<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Semantic search with a vector index">
<title>Semantic search with a vector index</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="330" fill="#fcfcfb"/>
<text x="20" y="30" font-size="14" text-anchor="start" fill="#52514e" font-weight="700">Offline</text>
<rect x="20" y="46" width="200" height="60" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="120.0" y="72.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">120 tickets</text>
<text x="120.0" y="89.65" font-size="11" text-anchor="middle" fill="#52514e">(or 100 million)</text>
<line x1="222" y1="76" x2="268" y2="76" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="46" width="190" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="365.0" y="72.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">embed each</text>
<text x="365.0" y="89.65" font-size="11" text-anchor="middle" fill="#52514e">text → vector</text>
<line x1="462" y1="76" x2="508" y2="76" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="510" y="36" width="230" height="80" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="625.0" y="62.5" font-size="15" text-anchor="middle" fill="#1d1d1f" font-weight="700">Vector index</text>
<text x="625.0" y="81.25" font-size="12" text-anchor="middle" fill="#52514e">FAISS, HNSW, pgvector,</text>
<text x="625.0" y="100.0" font-size="12" text-anchor="middle" fill="#52514e">Elasticsearch / OpenSearch kNN</text>
<text x="20" y="170" font-size="14" text-anchor="start" fill="#52514e" font-weight="700">Online</text>
<rect x="20" y="186" width="200" height="60" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="120.0" y="220.55" font-size="13" text-anchor="middle" fill="#1d1d1f">"courier is very slow"</text>
<line x1="222" y1="216" x2="268" y2="216" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="186" width="190" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="365.0" y="212.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">embed query</text>
<text x="365.0" y="229.65" font-size="11" text-anchor="middle" fill="#52514e">same model!</text>
<line x1="462" y1="216" x2="508" y2="216" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="510" y="186" width="230" height="60" rx="10" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="625.0" y="212.15" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">nearest neighbours</text>
<text x="625.0" y="229.65" font-size="11" text-anchor="middle" fill="#52514e">approximate, in milliseconds</text>
<line x1="625" y1="118" x2="625" y2="184" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<line x1="742" y1="216" x2="788" y2="216" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="790" y="170" width="190" height="92" rx="10" fill="#e0f0e0" stroke="#008300" stroke-width="2"/>
<text x="885" y="196" font-size="12" text-anchor="middle" fill="#1d1d1f" font-style="italic">"why is my order</text>
<text x="885" y="218" font-size="12" text-anchor="middle" fill="#1d1d1f" font-style="italic">taking so long"</text>
<text x="885" y="240" font-size="12" text-anchor="middle" fill="#1d1d1f" font-style="italic">"rider says he is near…"</text>
<text x="500" y="300" font-size="13" text-anchor="middle" fill="#52514e">Zero words in common with the query, still found. Keyword search (BM25) returned "portion size very small" instead.</text>
</svg>
