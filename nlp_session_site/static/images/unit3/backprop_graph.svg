<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="Forward and backward pass on a computational graph">
<title>Forward and backward pass on a computational graph</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="330" fill="#fcfcfb"/>
<rect x="45.0" y="100" width="150" height="70" rx="10" fill="#e9e7f4" stroke="#4a3aa7" stroke-width="2"/>
<text x="120.0" y="123.3" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">x = [1, 2]</text>
<text x="120.0" y="139.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">w = [0.5, -0.3]</text>
<text x="120.0" y="155.8" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">b = 0.1</text>
<rect x="235.0" y="100" width="130" height="70" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="300.0" y="139.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">z = w·x + b</text>
<rect x="440.0" y="100" width="140" height="70" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="510.0" y="139.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">p = sigmoid(z)</text>
<rect x="675.0" y="100" width="130" height="70" rx="10" fill="#fbe9e9" stroke="#e34948" stroke-width="2"/>
<text x="740.0" y="139.55" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">L = −log(p)</text>
<line x1="197" y1="135" x2="233" y2="135" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="367" y1="135" x2="438" y2="135" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="582" y1="135" x2="673" y2="135" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<text x="290" y="70" font-size="13" text-anchor="start" fill="#2a78d6" font-weight="700">forward →</text>
<text x="300" y="92" font-size="13" text-anchor="middle" fill="#2a78d6" font-family="Consolas, Menlo, monospace">z = 0.00</text>
<text x="510" y="92" font-size="13" text-anchor="middle" fill="#2a78d6" font-family="Consolas, Menlo, monospace">p = 0.500</text>
<text x="740" y="92" font-size="13" text-anchor="middle" fill="#2a78d6" font-family="Consolas, Menlo, monospace">L = 0.693</text>
<text x="290" y="208" font-size="13" text-anchor="start" fill="#e34948" font-weight="700">← backward (chain rule)</text>
<text x="740" y="232" font-size="12.5" text-anchor="middle" fill="#e34948" font-family="Consolas, Menlo, monospace">dL/dp = −1/p = −2.0</text>
<text x="510" y="232" font-size="12.5" text-anchor="middle" fill="#e34948" font-family="Consolas, Menlo, monospace">dL/dz = p − y = −0.5</text>
<text x="300" y="232" font-size="12.5" text-anchor="middle" fill="#e34948" font-family="Consolas, Menlo, monospace">dL/dw = dL/dz · x</text>
<text x="300" y="252" font-size="12.5" text-anchor="middle" fill="#e34948" font-family="Consolas, Menlo, monospace">= [−0.5, −1.0]</text>
<text x="300" y="272" font-size="12.5" text-anchor="middle" fill="#e34948" font-family="Consolas, Menlo, monospace">dL/db = −0.5</text>
<text x="500" y="312" font-size="13.5" text-anchor="middle" fill="#1d1d1f" font-weight="700">Update: w ← w − 0.1 × dL/dw = [0.55, −0.2].  Loss drops from 0.693 to 0.554.</text>
</svg>
