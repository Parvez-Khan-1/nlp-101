<text x="830" y="192" font-size="12.5" text-anchor="middle" fill="#52514e">but its vector is close to "mumbai",</text>
<text x="830" y="212" font-size="12.5" text-anchor="middle" fill="#52514e">"delhi" and "chennai", which did.</text>
