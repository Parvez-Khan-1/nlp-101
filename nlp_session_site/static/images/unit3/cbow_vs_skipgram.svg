<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="word2vec CBOW versus skip-gram">
<title>word2vec CBOW versus skip-gram</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="360" fill="#fcfcfb"/>
<text x="240" y="30" font-size="16" text-anchor="middle" fill="#2a78d6" font-weight="700">CBOW (continuous bag of words)</text>
<rect x="20" y="60" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="75.0" y="84.55" font-size="13" text-anchor="middle" fill="#1d1d1f">food</text>
<rect x="20" y="122" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="75.0" y="146.55" font-size="13" text-anchor="middle" fill="#1d1d1f">was</text>
<rect x="20" y="184" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="75.0" y="208.55" font-size="13" text-anchor="middle" fill="#1d1d1f">cold</text>
<rect x="20" y="246" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="75.0" y="270.55" font-size="13" text-anchor="middle" fill="#1d1d1f">and</text>
<line x1="132" y1="80" x2="188" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="132" y1="142" x2="188" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="132" y1="204" x2="188" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<line x1="132" y1="266" x2="188" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190" y="140" width="120" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="250.0" y="166.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">average</text>
<text x="250.0" y="182.675" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">vectors</text>
<line x1="312" y1="170" x2="358" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="360" y="145" width="110" height="50" rx="20" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="415.0" y="174.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">delivered</text>
<text x="240" y="318" font-size="13" text-anchor="middle" fill="#52514e">context words → predict the middle word</text>
<text x="240" y="338" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">faster; good for frequent words</text>
<line x1="500" y1="20" x2="500" y2="340" stroke="#dddbd4" stroke-width="1.5"/>
<text x="750" y="30" font-size="16" text-anchor="middle" fill="#eb6834" font-weight="700">Skip-gram</text>
<rect x="530" y="145" width="110" height="50" rx="20" fill="#fcece6" stroke="#eb6834" stroke-width="2"/>
<text x="585.0" y="174.9" font-size="14" text-anchor="middle" fill="#1d1d1f" font-weight="700">delivered</text>
<line x1="642" y1="170" x2="698" y2="170" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="700" y="140" width="120" height="60" rx="10" fill="#e5eefa" stroke="#2a78d6" stroke-width="2"/>
<text x="760.0" y="166.425" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">word</text>
<text x="760.0" y="182.675" font-size="13" text-anchor="middle" fill="#1d1d1f" font-weight="700">vector</text>
<line x1="822" y1="170" x2="868" y2="80" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="870" y="60" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="925.0" y="84.55" font-size="13" text-anchor="middle" fill="#1d1d1f">food</text>
<line x1="822" y1="170" x2="868" y2="142" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="870" y="122" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="925.0" y="146.55" font-size="13" text-anchor="middle" fill="#1d1d1f">was</text>
<line x1="822" y1="170" x2="868" y2="204" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="870" y="184" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="925.0" y="208.55" font-size="13" text-anchor="middle" fill="#1d1d1f">cold</text>
<line x1="822" y1="170" x2="868" y2="266" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="870" y="246" width="110" height="40" rx="20" fill="#e3f5ef" stroke="#1baf7a" stroke-width="2"/>
<text x="925.0" y="270.55" font-size="13" text-anchor="middle" fill="#1d1d1f">and</text>
<text x="750" y="318" font-size="13" text-anchor="middle" fill="#52514e">middle word → predict each context word</text>
<text x="750" y="338" font-size="12.5" text-anchor="middle" fill="#52514e" font-style="italic">slower; better for rare words and small data</text>
</svg>
