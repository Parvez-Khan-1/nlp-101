<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xml:space="preserve" role="img" aria-label="GloVe co-occurrence probability ratios">
<title>GloVe co-occurrence probability ratios</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker><marker id="ahu" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9b7b0"/></marker></defs>
<rect width="1000" height="300" fill="#fcfcfb"/>
<text x="160" y="50" font-size="13" text-anchor="end" fill="#52514e">probe word k →</text>
<text x="270" y="50" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">solid</text>
<text x="420" y="50" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">gas</text>
<text x="570" y="50" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">water</text>
<text x="720" y="50" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">fashion</text>
<text x="180" y="97" font-size="13.5" text-anchor="end" fill="#1d1d1f" font-weight="700">P(k | ice)</text>
<rect x="200" y="70" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="270" y="96" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">1.9e-4</text>
<rect x="350" y="70" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="420" y="96" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">6.6e-5</text>
<rect x="500" y="70" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="570" y="96" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">3.0e-3</text>
<rect x="650" y="70" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="720" y="96" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">1.7e-5</text>
<text x="180" y="147" font-size="13.5" text-anchor="end" fill="#1d1d1f" font-weight="700">P(k | steam)</text>
<rect x="200" y="120" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="270" y="146" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">2.2e-5</text>
<rect x="350" y="120" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="420" y="146" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">7.8e-4</text>
<rect x="500" y="120" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="570" y="146" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">2.2e-3</text>
<rect x="650" y="120" width="140" height="40" rx="6" fill="#f1f0ec" stroke="none"/>
<text x="720" y="146" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace">1.8e-5</text>
<text x="180" y="197" font-size="13.5" text-anchor="end" fill="#eb6834" font-weight="700">ratio ice / steam</text>
<rect x="200" y="170" width="140" height="40" rx="6" fill="#fad9cc" stroke="none"/>
<text x="270" y="196" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">8.9</text>
<rect x="350" y="170" width="140" height="40" rx="6" fill="#fad9cc" stroke="none"/>
<text x="420" y="196" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">0.085</text>
<rect x="500" y="170" width="140" height="40" rx="6" fill="#e1e1e0" stroke="none"/>
<text x="570" y="196" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">1.36</text>
<rect x="650" y="170" width="140" height="40" rx="6" fill="#e1e1e0" stroke="none"/>
<text x="720" y="196" font-size="14" text-anchor="middle" fill="#1d1d1f" font-family="Consolas, Menlo, monospace" font-weight="700">0.96</text>
<text x="500" y="242" font-size="12.5" text-anchor="middle" fill="#52514e">Large ratio → related to ice (solid). Small → related to steam (gas). ≈1 → related to both (water) or neither (fashion).</text>
<text x="500" y="264" font-size="12.5" text-anchor="middle" fill="#1d1d1f">GloVe learns vectors whose dot products reproduce these global co-occurrence statistics.</text>
<text x="500" y="288" font-size="11.5" text-anchor="middle" fill="#52514e" font-style="italic">Numbers from Pennington, Socher &amp; Manning (2014), computed on a 6-billion-word corpus.</text>
</svg>
