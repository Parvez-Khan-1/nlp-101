<text x="888" y="114" font-size="12.5" text-anchor="middle" fill="#52514e">Weights W, b are just</text>
<text x="888" y="134" font-size="12.5" text-anchor="middle" fill="#52514e">matrices of numbers.</text>
<text x="888" y="154" font-size="12.5" text-anchor="middle" fill="#52514e">Training = finding</text>
<text x="888" y="174" font-size="12.5" text-anchor="middle" fill="#52514e">values that make the</text>
<text x="888" y="194" font-size="12.5" text-anchor="middle" fill="#52514e">right answer likely.</text>
<text x="888" y="214" font-size="12.5" text-anchor="middle" fill="#52514e">This is where the</text>
<text x="888" y="234" font-size="12.5" text-anchor="middle" fill="#52514e">calculus comes in →</text>
