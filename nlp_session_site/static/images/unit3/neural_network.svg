<text x="120" y="50" font-size="12.5" text-anchor="middle" fill="#52514e" font-family="Consolas, Menlo, monospace">word vectors</text>
<text x="400" y="30" font-size="15" text-anchor="middle" fill="#4a3aa7" font-weight="700">Hidden h</text>
<text x="400" y="50" font-size="12.5" text-anchor="middle" fill="#52514e" font-family="Consolas, Menlo, monospace">h = ReLU(W₁x + b₁)</text>
<text x="680" y="30" font-size="15" text-anchor="middle" fill="#008300" font-weight="700">Output ŷ</text>
<text x="680" y="50" font-size="12.5" text-anchor="middle" fill="#52514e" font-family="Consolas, Menlo, monospace">ŷ = softmax(W₂h + b₂)</text>
